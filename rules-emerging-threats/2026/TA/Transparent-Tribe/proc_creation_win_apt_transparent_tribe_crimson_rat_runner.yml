title: Transparent Tribe Crimson RAT Batch Runner Execution
id: fa72336f-17ea-4e5e-a7d6-df6585635cfe
status: experimental
description: |
    Detects the execution of the "mycsd.bat" runner script used by Transparent Tribe (APT36) to deploy Crimson RAT, as reported by Acronis TRU in February 2026.
    In this campaign against Indian startups, an ISO ("MeetBisht.iso") contains a LNK disguised as an Excel file ("Meet Bisht.xlsx.lnk").
    The LNK starts the batch script minimised via "%COMSPEC% /c start /MIN", which shows a decoy spreadsheet, removes the Mark of the Web and launches Crimson RAT.
references:
    - https://www.acronis.com/en/tru/posts/new-year-new-sector-transparent-tribe-targets-indias-startup-ecosystem/
author: '@sohankanna'
date: 2026-11-22
tags:
    - attack.execution
    - attack.t1204.002
    - attack.t1059.003
    - attack.g0134
    - detection.emerging-threats
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        - Image|endswith: '\cmd.exe'
        - OriginalFileName: 'Cmd.Exe'
    selection_cli:
        CommandLine|contains|all:
            - 'start '
            - '/MIN'
            - 'mycsd.bat'
    condition: all of selection_*
falsepositives:
    - Unlikely
level: high
