title: Account Unlocked Or Expiration Changed Via Usermod Or Chage
id: 20019d91-00dd-4ac9-8c25-76766315fe4a
status: experimental
description: |
    Detects "usermod" or "chage" unlocking a local account or changing its expiration date.
    Adversaries reactivate locked or expired local accounts to regain access with credentials that are no longer monitored.
references:
    - https://www.man7.org/linux/man-pages/man8/usermod.8.html
    - https://www.man7.org/linux/man-pages/man1/chage.1.html
    - https://github.com/redcanaryco/atomic-red-team/blob/388942adbd9641f4dfdcf079d7efe9a75ec0ac43/atomics/T1078.003/T1078.003.md
author: elhoim
date: 2026-10-01
tags:
    - attack.initial-access
    - attack.persistence
    - attack.privilege-escalation
    - attack.stealth
    - attack.t1078.003
    - detection.threat-hunting
logsource:
    product: linux
    category: process_creation
detection:
    selection_usermod_img:
        Image|endswith: '/usermod'
    selection_usermod_cli:
        CommandLine|contains:
            - ' -U '
            - ' --unlock '
            - ' -e '
            - ' --expiredate '
    selection_chage_img:
        Image|endswith: '/chage'
    selection_chage_cli:
        CommandLine|contains:
            - ' -E '
            - ' --expiredate '
    condition: all of selection_usermod_* or all of selection_chage_*
falsepositives:
    - Administrators managing account lifecycle
level: low
simulation:
    - type: atomic-red-team
      name: Reactivate a locked/expired account (Linux)
      technique: T1078.003
      atomic_guid: d2b95631-62d7-45a3-aaef-0972cea97931
