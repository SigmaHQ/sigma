title: Non-Interactive SSH Password Authentication Via Sshpass
id: d2fb0fa2-fc04-4634-abbb-fcbed24bfe3d
status: experimental
description: |
    Detects the use of "sshpass" to supply an SSH password non-interactively, either on the command line ("-p"), from a file ("-f"), from a file descriptor ("-d") or from an environment variable ("-e").
    Adversaries use sshpass in loops to perform SSH brute force, password spraying or credential stuffing, and to move laterally with harvested credentials.
references:
    - https://linux.die.net/man/1/sshpass
    - https://github.com/redcanaryco/atomic-red-team/blob/388942adbd9641f4dfdcf079d7efe9a75ec0ac43/atomics/T1110.004/T1110.004.md
author: elhoim
date: 2026-10-01
tags:
    - attack.credential-access
    - attack.lateral-movement
    - attack.t1110.004
    - attack.t1021.004
    - detection.threat-hunting
logsource:
    product: linux
    category: process_creation
detection:
    selection_img:
        Image|endswith: '/sshpass'
    selection_target:
        CommandLine|contains:
            - ' scp '
            - ' sftp '
            - ' ssh '
            - '/scp '
            - '/sftp '
            - '/ssh '
            - ' rsync '
    condition: all of selection_*
falsepositives:
    - Automation and configuration management tools (e.g. Ansible with password authentication) using sshpass
level: low
simulation:
    - type: atomic-red-team
      name: SSH Credential Stuffing From Linux
      technique: T1110.004
      atomic_guid: 4f08197a-2a8a-472d-9589-cd2895ef22ad
