title: Password Protected Archive Creation Via CLI - Linux
id: af17ed71-8c15-4e6c-b5db-e471b91dca21
status: experimental
description: |
    Detects the creation of a password protected or encrypted archive with "zip", "7z" or "rar".
    Adversaries encrypt staged data before exfiltration to evade content inspection, deliver password protected payloads, or encrypt files for impact.
references:
    - https://linux.die.net/man/1/zip
    - https://github.com/redcanaryco/atomic-red-team/blob/388942adbd9641f4dfdcf079d7efe9a75ec0ac43/atomics/T1560.001/T1560.001.md
    - https://github.com/redcanaryco/atomic-red-team/blob/388942adbd9641f4dfdcf079d7efe9a75ec0ac43/atomics/T1027.013/T1027.013.md
    - https://github.com/redcanaryco/atomic-red-team/blob/388942adbd9641f4dfdcf079d7efe9a75ec0ac43/atomics/T1486/T1486.md
author: elhoim
date: 2026-10-01
tags:
    - attack.collection
    - attack.stealth
    - attack.impact
    - attack.t1560.001
    - attack.t1027.013
    - attack.t1486
    - detection.threat-hunting
logsource:
    product: linux
    category: process_creation
detection:
    selection_zip_img:
        Image|endswith: '/zip'
    selection_zip_cli:
        CommandLine|contains:
            - ' -P '
            - ' --password '
            - ' -e '
            - ' --encrypt '
    selection_7z_img:
        Image|endswith:
            - '/7z'
            - '/7za'
            - '/7zr'
            - '/7zz'
    selection_7z_cli_add:
        CommandLine|contains: ' a '
    selection_7z_cli_pass:
        CommandLine|contains: ' -p'
    selection_rar_img:
        Image|endswith: '/rar'
    selection_rar_cli_add:
        CommandLine|contains: ' a '
    selection_rar_cli_pass:
        CommandLine|contains:
            - ' -hp'
            - ' -p'
    condition: all of selection_zip_* or all of selection_7z_* or all of selection_rar_*
falsepositives:
    - Users or backup scripts creating password protected archives
level: low
simulation:
    - type: atomic-red-team
      name: Password-Protected ZIP Payload Extraction and Execution
      technique: T1027.013
      atomic_guid: c2ca068a-eb1e-498f-9f93-3d554c455916
    - type: atomic-red-team
      name: Data Encrypted with zip and gpg symmetric
      technique: T1560.001
      atomic_guid: 0286eb44-e7ce-41a0-b109-3da516e05a5f
    - type: atomic-red-team
      name: Encrypt files using 7z (FreeBSD/Linux)
      technique: T1486
      atomic_guid: 53e6735a-4727-44cc-b35b-237682a151ad
