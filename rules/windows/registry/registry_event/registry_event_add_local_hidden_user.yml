title: Creation of a Local Hidden User Account by Registry
id: 460479f3-80b7-42da-9c43-2cc1d54dbccd
related:
    - id: 8106cdf0-7503-49a9-806a-c5cee9885369
      type: similar
status: test
description: |
    Detects creation or modification of local account name entries ending with a
    dollar sign under the SAM Users Names registry path. This indicates an attempt
    to creates a hidden local user account, which is a technique used by threat
    actors to maintain persistence on a compromised system while avoiding detection.
references:
    - https://twitter.com/SBousseaden/status/1387530414185664538
author: Christian Burkard (Nextron Systems)
date: 2021-05-03
modified: 2026-08-21
tags:
    - attack.persistence
    - attack.t1136.001
logsource:
    product: windows
    category: registry_event
detection:
    selection_create:
        EventType: 'CreateKey'
        TargetObject|endswith: '$'
        TargetObject|contains: '\SAM\SAM\Domains\Account\Users\Names\'
    selection_set:
        EventType: 'SetValue'
        TargetObject|contains: '\SAM\SAM\Domains\Account\Users\Names\'
        TargetObject|endswith: '$\(Default)'
    condition: 1 of selection_*
falsepositives:
    - Unknown
level: high
regression_tests_path: regression_data/rules/windows/registry/registry_event/registry_event_add_local_hidden_user/info.yml
simulation:
    - type: atomic-red-team
      name: Create Hidden User in Registry
      technique: T1564.002
      atomic_guid: 173126b7-afe4-45eb-8680-fa9f6400431c
