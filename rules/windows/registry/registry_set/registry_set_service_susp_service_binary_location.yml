title: Suspicious Service Binary Location
id: 1a8af205-1d32-4352-b937-d933ecf5e7d6
related:
    - id: a07f0359-4c90-4dc4-a681-8ffea40b4f47
      type: obsolete
    - id: 8a3c8f2e-9d7a-4b5f-a1e3-2c6d9f0b4a7e
      type: similar
status: experimental
description: |
    Detects services with a binary path pointing to a suspicious location.
    Attackers may create or modify services to point to malicious executables in order to maintain persistence on a compromised system.
    It could be particularly suspicious if the service binary path points to a directory that is not commonly used for legitimate software, such as user profile directories, temporary folders, or other non-standard locations.
references:
    - https://www.elastic.co/guide/en/security/8.19/suspicious-imagepath-service-creation.html
    - https://docs.specterops.io/ghostpack-docs/SharpUp-mdx/checks/unquotedservicepath
author: Florian Roth (Nextron Systems), frack113
date: 2026-10-11
tags:
    - attack.persistence
    - attack.defense-impairment
    - attack.t1112
    - attack.privilege-escalation
    - attack.t1543.003
logsource:
    category: registry_set
    product: windows
detection:
    selection_service_imagepath:
        TargetObject|contains|all:
            - '\System\'
            - 'ControlSet'
            - '\Services\'
        TargetObject|endswith: '\ImagePath'
        Details|contains:
            - '\$Recycle.Bin\'
            - '\ADMIN$\'
            - '\Desktop\'
            - '\Documents\'
            - '\Downloads\'
            - '\Favorites\'
            - '\Favourites\'
            - '\Music\'
            - '\Perflogs\'
            - '\Pictures\'
            - '\Temp\'
            - '\Users\Default\'
            - '\Users\Public\'
            - '\Videos\'
            - '\Windows\Debug\'
            - '\Windows\Tasks\'
            - '\Windows\Tracing\'
            - '%Public%\'
            - '%Temp%'
    filter_optional_mbamservice:
        TargetObject|endswith: '\CurrentControlSet\Services\MBAMInstallerService\ImagePath'
        Details|endswith: '\AppData\Local\Temp\MBAMInstallerService.exe"'
        Image: 'C:\Windows\system32\services.exe'
    condition: 1 of selection_* and not 1 of filter_optional_*
falsepositives:
    - Software installation or upgrade staging a service binary in a temporary or user-profile directory before moving it
    - Backup or deployment tooling running from a staging directory and registering or updating a service
    - Legitimate administrative activity re-pointing a service ImagePath. Inspect the writing process and user context to determine intent
level: high
regression_tests_path: regression_data/rules/windows/registry/registry_set/registry_set_service_susp_service_binary_location/info.yml
simulation:
    - type: atomic-red-team
      name: Modify Fax service to run PowerShell
      technique: T1543.003
      atomic_guid: ed366cde-7d12-49df-a833-671904770b9f
