title: Service from Suspicious Directory Enabled
id: 8a3c8f2e-9d7a-4b5f-a1e3-2c6d9f0b4a7e
related:
    - id: 5def21e6-8927-4ebd-bf20-16f440369564
      type: similar
    - id: 1a8af205-1d32-4352-b937-d933ecf5e7d6
      type: similar
status: experimental
description: |
    Detects the installation or modification of a service with an ImagePath pointing to a suspicious directory and a start type that would cause the service to be started automatically.
    Services with automatic or system start types that execute from user-writable or non-standard directories can indicate persistence mechanisms used by attackers.
references:
    - https://www.elastic.co/docs/reference/security/prebuilt-rules/rules/windows/persistence_service_windows_service_winlog
    - https://docs.specterops.io/ghostpack-docs/SharpUp-mdx/checks/unquotedservicepath
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2026-10-11
tags:
    - attack.persistence
    - attack.defense-impairment
    - attack.privilege-escalation
    - attack.t1543.003
logsource:
    product: windows
    service: system
detection:
    selection_event:
        Provider_Name: 'Service Control Manager'
        EventID: 7045
    selection_path:
        ImagePath|contains:
            - '\$Recycle.Bin\'
            - '\ADMIN$\'
            - '\AppData\'
            - '\Desktop\'
            - '\Documents\'
            - '\Downloads\'
            - '\Favorites\'
            - '\Favourites\'
            - '\Inetpub\'
            - '\Music\'
            - '\Perflogs\'
            - '\Pictures\'
            - '\Temp\'
            - '\Users\Default\'
            - '\Users\Public\'
            - '\Videos\'
            - '\Windows\Debug\'
            - '\Windows\Tasks\'
            - '\Windows\Tracing\'
    selection_starttype:
        StartType:
            - 'boot start'
            - 'system start'
            - 'auto start'
    filter_optional_mbamservice:
        ImagePath|endswith: '\AppData\Local\Temp\MBAMInstallerService.exe"'
    filter_optional_zoom:
        ImagePath|contains: 'C:\Program Files\Common Files\'
        ServiceName: 'Zoom Sharing Service'
    condition: all of selection_* and not 1 of filter_optional_*
falsepositives:
    - Software installation, upgrade or uninstall registering a service from a user-writable or temporary path
    - Zoom software updating its Zoom Sharing Service from C:\Program Files\Common Files\
    - Bitdefender GravityZone installer registering MBAMInstallerService from a temporary path
level: high
regression_tests_path: regression_data/rules/windows/builtin/system/service_control_manager/win_system_susp_service_startup_modification/info.yml
simulation:
    - type: atomic-red-team
      name: Service Installation PowerShell
      technique: T1543.003
      atomic_guid: 491a4af6-a521-4b74-b23b-f7b3f1ee9e77
