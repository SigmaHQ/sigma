title: ADCS Certificate Template With CT_FLAG_NO_SECURITY_EXTENSION
id: f3459b98-d439-4565-be50-d957637280ad
status: experimental
description: |
    Detects an Active Directory Certificate Services (ADCS) certificate template that is loaded or updated with the "CT_FLAG_NO_SECURITY_EXTENSION" enrollment flag.
    Certificates issued from such templates do not embed the szOID_NTDS_CA_SECURITY_EXT security extension (the requester SID), which disables strong certificate mapping (ESC9).
    An attacker who can modify the UPN of an account enrolling in such a template can obtain a certificate that authenticates as another principal.
references:
    - https://www.specterops.io/assets/resources/Certified_Pre-Owned.pdf
    - https://github.com/ly4k/Certipy/wiki/06-%E2%80%90-Privilege-Escalation
    - https://research.ifcr.dk/certipy-4-0-esc9-esc10-bloodhound-gui-new-authentication-and-request-methods-and-more-7237d88061f7
    - https://support.microsoft.com/en-us/topic/kb5014754-certificate-based-authentication-changes-on-windows-domain-controllers-ad2c23b0-15d8-4340-a468-4d4f3b188f16
author: elhoim
date: 2026-10-15
tags:
    - attack.privilege-escalation
    - attack.credential-access
    - attack.t1649
logsource:
    product: windows
    service: security
    definition: |
        Requires auditing of Certification Services on the CA server.
            (1) CA\AuditFilter must have the relevant bits set (e.g. "certutil -setreg CA\AuditFilter 127" followed by a CertSvc restart).
            (2) The "Audit Certification Services" subcategory must be enabled (auditpol /set /subcategory:"Certification Services" /success:enable).
detection:
    selection_4898:
        EventID: 4898 # Certificate Services loaded a template
        TemplateContent|contains: 'CT_FLAG_NO_SECURITY_EXTENSION'
    selection_4899:
        EventID: 4899 # A Certificate Services template was updated
        NewTemplateContent|contains: 'CT_FLAG_NO_SECURITY_EXTENSION'
    condition: 1 of selection_*
falsepositives:
    - Certificate templates intentionally configured without the security extension for compatibility reasons
level: medium
