title: ADCS Certificate Template With Certificate Request Agent EKU
id: 3d12834a-5fa0-4494-b8bd-034b6297f84d
status: experimental
description: |
    Detects an Active Directory Certificate Services (ADCS) certificate template that is loaded, updated or modified to carry the "Certificate Request Agent" Extended Key Usage (1.3.6.1.4.1.311.20.2.1).
    Certificates issued from such templates act as enrollment agent certificates that can request certificates on behalf of other users (ESC3).
    If low-privileged users can enroll in such a template, they can obtain authentication certificates for any user, including Domain Admins.
references:
    - https://www.specterops.io/assets/resources/Certified_Pre-Owned.pdf
    - https://github.com/ly4k/Certipy/wiki/06-%E2%80%90-Privilege-Escalation
    - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4898
    - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4899
author: elhoim
date: 2026-10-15
tags:
    - attack.privilege-escalation
    - attack.credential-access
    - attack.t1649
logsource:
    product: windows
    service: security
    definition: |
        Events 4898 and 4899 require "Audit Certification Services" on the CA server, while event 5136 requires "Audit Directory Service Changes" on Domain Controllers
        and an auditing SACL on the "CN=Certificate Templates,CN=Public Key Services,CN=Services,CN=Configuration" container.
detection:
    selection_4898:
        EventID: 4898 # Certificate Services loaded a template
        TemplateContent|contains: '1.3.6.1.4.1.311.20.2.1'
    selection_4899:
        EventID: 4899 # A Certificate Services template was updated
        NewTemplateContent|contains: '1.3.6.1.4.1.311.20.2.1'
    selection_5136:
        EventID: 5136
        ObjectClass: 'pKICertificateTemplate'
        AttributeLDAPDisplayName:
            - 'pKIExtendedKeyUsage'
            - 'msPKI-Certificate-Application-Policy'
        AttributeValue: '1.3.6.1.4.1.311.20.2.1'
    condition: 1 of selection_*
falsepositives:
    - Legitimate enrollment agent templates (e.g. the built-in "EnrollmentAgent" templates used for smart card provisioning)
level: medium
