title: Password Change Attempt on Privileged Domain Account
id: f3a1d8e2-5c7b-4f0a-9e6d-2b4c8a1f3d7e
status: experimental
description: |
    Detects password change (Event 4723) and password reset (Event 4724) activity targeting
    privileged domain accounts such as built-in Administrator and krbtgt. Legitimate
    password operations on these accounts are rare and should be tightly controlled.
    This rule is particularly relevant to Kerberos Change Password protocol abuses such as
    ResetNightmare (CVE-2026-27912), where the attacker uses a forged TGT to invoke the
    Kerberos changepw protocol against the target — generating a 4723 rather than a 4724
    because the KDC processes it as a self-service change (SubjectUserName equals
    TargetUserName). Note that the TargetUserName list should be extended with
    environment-specific Domain Admin account names for broader coverage.
references:
    - https://github.com/semperis-community/resetnightmare
    - https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-4723
    - https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-4724
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2026-08-13
tags:
    - attack.credential-access
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1098
    - attack.t1212
    - attack.t1558
logsource:
    product: windows
    service: security
    definition: 'Requirements: Advanced Audit Policy "Audit User Account Management" must be enabled.'
detection:
    selection:
        EventID:
            - 4723 # self-service password change
            - 4724 # admin-initiated password reset
        TargetUserName:
            # Add environment-specific privileged accounts here for broader coverage like Domain Admins, Enterprise Admins, etc.
            - 'Administrator'
            - 'krbtgt'
    condition: selection
falsepositives:
    - Legitimate password rotation of privileged accounts by authorized administrators or PAM solutions
    - Password manager or privileged access workstation tooling performing scheduled rotations
level: high
