title: PKINIT Certificate Pre-Authentication (Base)
id: 0d2b9a3e-6c1f-4e7a-9a1a-5f1e9c6b7a01
name: pkinit_cert_preauth_base
status: experimental
description: |
  Base event for a PKINIT (certificate / smartcard) Kerberos AS-REQ, surfaced via
  Security Event 4768 (a Kerberos TGT was requested). On its own this is NOT an alert:
  PKINIT cert logon is a normal event. It is the atomic selection consumed by the
  CVE-2026-69676 replay-burst correlation rule. Field names are verified against the
  raw Security-4768 EventData Name attributes (see VALIDATION.md).
references:
  - https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-69676
author: Andrew Schwartz (Huntress), @4ndr3w6S
date: 2026-10-19
license: DRL-1.1
tags:
  - attack.lateral-movement
  - attack.t1210
  - cve.2026-69676
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4768
    PreAuthType:
      - 15   # PA-PK-AS-REQ-OLD
      - 16   # PA-PK-AS-REQ (PKINIT)
  has_cert:
    CertThumbprint|exists: true
  condition: selection and has_cert
falsepositives:
  - Smartcard / certificate logons are legitimate. This base event is designed to be
    consumed by the replay-burst correlation, not alerted on directly.
level: informational
