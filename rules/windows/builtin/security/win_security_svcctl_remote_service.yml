title: Remote Service Activity via SVCCTL Named Pipe
id: 586a8d6b-6bfe-4ad9-9d78-888cd2fe50c3
related:
    - id: 1a0eb388-ac98-4ebc-8555-be233da404e7
      type: similar
    - id: 0daf2213-3a25-42e9-acac-c94ac48e4629
      type: similar
    - id: cc4aac41-ab53-47d8-9f97-bbae8fb35f05
      type: similar
status: test
description: Detects remote service activity via remote access to the svcctl named pipe
references:
    - https://web.archive.org/web/20230329155141/https://blog.menasec.net/2019/03/threat-hunting-26-remote-windows.html
author: Samir Bousseaden
date: 2019-04-03
modified: 2026-09-24
tags:
    - attack.lateral-movement
    - attack.persistence
    - attack.t1021.002
logsource:
    product: windows
    service: security
    definition: 'The advanced audit policy setting "Object Access > Audit Detailed File Share" must be configured for Success/Failure'
detection:
    selection:
        EventID: 5145
        ShareName: '\\\\\*\\IPC$' # looking for the string \\*\IPC$
        RelativeTargetName: svcctl
        AccessList|contains: 'WriteData'
    condition: selection
falsepositives:
    - Unknown
level: medium
