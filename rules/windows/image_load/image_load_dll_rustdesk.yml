title: Load Of Rustdesk Desktop_multi_window_plugin DLL
id: e5970272-21cc-494a-9705-a124b6f20d32
status: experimental
description: |
    Detects the RustDesk executable loading its `desktop_multi_window_plugin.dll`, or the execution of a process with the RustDesk original file name `flutter_hbb.exe`.
    Adversaries may abuse legitimate desktop support and remote access software, such as RustDesk, TeamViewer, Go2Assist or LogMeIn, to establish an interactive command and control channel to target systems within networks.
    These services are commonly used as legitimate technical support software, and may be allowed by application control within a target environment.
references:
    - https://securityarsenal.com/blog/operation-poisson-havoc-c2-and-rustdesk-fileless-campaign-otx-pulse-analysis
    - https://asec.ahnlab.com/en/84729/
    - https://rustdesk.com/blog/rustdesk-and-remote-access-scams/
author: frack113
date: 2026-09-25
tags:
    - attack.command-and-control
    - attack.t1219.002
logsource:
    category: image_load
    product: windows
detection:
    selection:
        - ImageLoaded|endswith: 'desktop_multi_window_plugin.dll'
        - OriginalFileName: 'flutter_hbb.exe'
    condition: selection
falsepositives:
    - Legitimate use
level: medium
regression_tests_path: regression_data/rules/windows/image_load/image_load_dll_rustdesk/info.yml
simulation:
    - type: atomic-red-team
      name: RustDesk Files Detected Test on Windows
      technique: T1219
      atomic_guid: f1641ba9-919a-4323-b74f-33372333bf0e
