title: Potential Regsvr32 Commandline Flag Anomaly
id: b236190c-1c61-41e9-84b3-3fe03f6d76b0
status: test
description: |
    Detects regsvr32 invocations where the "/i" (DllInstall) flag is used without "/n" (skip DllRegisterServer/DllUnregisterServer).
    Legitimate use of "/i" is normally paired with "/n" since DllInstall is meant as an alternative to the standard registration path.
    When "/n" is absent, regsvr32 both registers the DLL and runs DllInstall, which is an unusual combination outside of abuse scenarios.
references:
    - https://twitter.com/sbousseaden/status/1282441816986484737?s=12
author: Florian Roth (Nextron Systems)
date: 2019-07-13
modified: 2026-07-10
tags:
    - attack.stealth
    - attack.t1218.010
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        - Image|endswith: '\regsvr32.exe'
        - OriginalFileName: 'REGSVR32.EXE'
    selection_cli_flag:
        CommandLine|contains|windash: ' /i'
    filter_main_flag:
        CommandLine|contains|windash: ' /n '
    condition: all of selection_* and not 1 of filter_main_*
falsepositives:
    - Administrator typo might cause some false positives
level: medium
