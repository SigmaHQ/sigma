title: MCP Server Execution Attempt Via NPX Or UVX
id: 56e93478-0d6c-49fd-9ff4-a04543d8220d
related:
    - id: afa71271-6a97-4e47-810f-83120fb1a4ce
      type: similar
status: experimental
description: |
    Detects Node.EXE or UV launching an MCP (Model Context Protocol) server via "npx" or "uvx".
    MCP servers run with the privileges of the user and often expose local tools, files, or credentials to an AI agent.
    Attackers can persist or execute untrusted code by adding an "npx -y" or "uvx" MCP server entry to an agent config (Claude Desktop, Cursor, VS Code).
    Analysts should verify the package name, source, and parent process.
    Tune this rule based on whether MCP servers are allowed in your environment.
    In environments where AI agent tooling is authorized, this detection may reflect normal activity and the alert level should be adjusted accordingly.
references:
    - https://cheatsheetseries.owasp.org/cheatsheets/MCP_Security_Cheat_Sheet.html
    - https://modelcontextprotocol.io/docs/develop/connect-local-servers
    - https://github.com/modelcontextprotocol/servers
author: phoenix766
date: 2026-09-17
tags:
    - attack.execution
    - attack.persistence
    - attack.t1059.007
    - attack.t1059.006
    - attack.t1195.002
logsource:
    product: windows
    category: process_creation
detection:
    selection_npx_img:
        - Image|endswith: '\node.exe'
        - OriginalFileName: 'node.exe'
    selection_npx_npx:
        CommandLine|contains: 'npx-cli.js'
    selection_npx_pkg:
        CommandLine|contains:
            - 'mcp-server'
            - '@modelcontextprotocol/'
    selection_uvx_img:
        - Image|endswith:
              - '\uvx.exe'
              - '\uv.exe'
        - OriginalFileName:
              - 'uvx.exe'
              - 'uv.exe'
    selection_uvx_cli:
        CommandLine|contains:
            - 'mcp-server'
            - '@modelcontextprotocol/'
    condition: all of selection_npx_* or all of selection_uvx_*
falsepositives:
    - Legitimate MCP server startup from approved AI agent configurations (Claude Desktop, Cursor, VS Code).
    - Developers installing or testing official MCP packages.
level: medium
