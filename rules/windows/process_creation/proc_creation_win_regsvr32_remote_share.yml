title: Suspicious Regsvr32 Execution From Remote Share
id: 88a87a10-384b-4ad7-8871-2f9bf9259ce5
status: test
description: |
    Detects REGSVR32.exe to execute DLL hosted on remote shares.
    This could be an indicator of threat actor abusing regsvr32 to download and install DLLs located
    remotely on a network share of threat actor infrastructure.
references:
    - https://thedfirreport.com/2022/10/31/follina-exploit-leads-to-domain-compromise/
    - https://www.cyberproof.com/blog/beyond-powershell-analyzing-the-multi-action-clickfix-variant/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-10-31
modified: 2026-07-10
tags:
    - attack.stealth
    - attack.t1218.010
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        - Image|endswith: '\regsvr32.exe'
        - OriginalFileName: '\REGSVR32.EXE'
    selection_cli:
        CommandLine|contains: ' \\\\'
    condition: all of selection_*
falsepositives:
    - Unknown
# Decrease to medium if this is something common in your org
level: high
