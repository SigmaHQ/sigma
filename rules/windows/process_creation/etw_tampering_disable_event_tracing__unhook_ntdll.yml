title: ETW Tampering (disable event tracing / unhook ntdll)
id: 47e406ef-d07a-5647-eade-0748afecd7b6
status: experimental
description: Detects attempts to tamper with ETW or unhook ntdll to impair event tracing defenses.
references:
    - https://entroprism.net
author: Entroprism (Beijing Yijun Foreign Trade Co., Ltd.)
date: 2026/11/03
tags:
    - attack.t1562
    - detection.threat_hunting
logsource:
    product: windows
    category: process_creation
detection:
  selection_disable:
    CommandLine|contains:
      - 'EtwEventWrite'
      - 'ntdll!Etw'
  selection_unhook:
    CommandLine|contains:
      - 'NtProtectVirtualMemory'
      - 'ntdll.dll'
  condition: selection_disable or selection_unhook
level: high
falsepositives:
  - legitimate debugging or instrumentation tools
