title: Potentially Suspicious WSLC Host Directory Mount With Shell
id: 92b757fa-dcf0-4659-a571-3704b2ed20e2
status: test
description: |
    Detects Microsoft WSL container CLI execution that bind mounts a sensitive Windows host directory into a Linux container and invokes an inline Unix shell.
    This may allow a threat actor to access or modify host files with Linux tooling while the inner Linux process is not represented as a Windows child process.
references:
    - https://learn.microsoft.com/en-us/windows/wsl/tutorials/wsl-containers
    - https://devblogs.microsoft.com/commandline/wslc-architecture-deep-dive/
    - https://blogs.windows.com/windowsdeveloper/2026/09/29/wsl-containers-now-generally-available/
author: Diablo Research
date: 2026-09-30
tags:
    - attack.execution
    - attack.defense-evasion
    - attack.t1059.004
    - attack.t1610
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        - Image|endswith: '\wslc.exe'
        - Image: 'C:\Program Files\WSL\container.exe'
        - OriginalFileName: 'wslc.exe'
    selection_run:
        CommandLine|contains:
            - ' run '
            - ' container run '
    selection_mount_volume:
        CommandLine|contains:
            - ' -v '
            - ' --volume '
    selection_mount_bind:
        CommandLine|contains|all:
            - ' --mount '
            - 'type=bind'
    selection_host_path:
        CommandLine|contains:
            - ':\Users\'
            - ':\Windows\'
            - ':\ProgramData\'
            - ':\Temp\'
            - ':\inetpub\'
    selection_shell:
        CommandLine|contains:
            - ' sh '
            - ' bash '
            - ' ash '
            - ' dash '
            - ' zsh '
            - '/bin/sh'
            - '/bin/bash'
            - '/bin/ash'
            - '/bin/dash'
            - '/bin/zsh'
    selection_shell_flag:
        CommandLine|contains:
            - ' -c '
            - ' -lc '
    condition: selection_img and selection_run and 1 of selection_mount_* and selection_host_path and selection_shell and selection_shell_flag
falsepositives:
    - Legitimate container development or administrative workflows that intentionally bind mount Windows user or system directories and invoke an inline shell
level: medium
