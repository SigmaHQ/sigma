title: Potential DLL Execution Via OpenSSH PKCS11Provider
id: 28869694-2516-46e0-86ca-a90478e50731
status: experimental
description: |
    Detects the use of the OpenSSH PKCS11Provider option with SSH or SCP.
    This option can be abused to load a DLL from a local path or remote SMB share into a trusted OpenSSH process.
references:
    - https://lolbas-project.github.io/lolbas/Binaries/Ssh/
    - https://lolbas-project.github.io/lolbas/Binaries/Scp/
    - https://man.openbsd.org/ssh_config#PKCS11Provider
author: Nazar Diachok (@Diablo-research)
date: 2026-09-19
tags:
    - attack.stealth
    - attack.t1202
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith:
            - '\ssh.exe'
            - '\scp.exe'
    selection_cli:
        CommandLine|contains: 'PKCS11Provider='
    condition: all of selection_*
falsepositives:
    - Legitimate use of smart cards, hardware security modules, or other PKCS#11 providers with OpenSSH
level: medium
