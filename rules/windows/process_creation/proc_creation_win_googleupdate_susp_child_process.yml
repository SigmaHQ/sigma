title: Potentially Suspicious GoogleUpdate Child Process
id: 84b1ecf9-6eff-4004-bafb-bae5c0e251b2
related:
    - id: bdbab15a-3826-48fa-a1b7-723cd8f32fcc
      type: derived
status: test
description: Detects potentially suspicious child processes of "GoogleUpdate.exe"
references:
    - https://www.ncsc.gov.uk/static-assets/documents/malware-analysis-reports/goofy-guineapig/NCSC-MAR-Goofy-Guineapig.pdf
author: Nasreddine Bencherchali (Nextron Systems), elhoim - David André (correction)
date: 2023-05-15
modified: 2026-09-24
tags:
    - attack.stealth
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        ParentImage|endswith: '\GoogleUpdate.exe'
    filter_main_known_legit:
        # Some other legit child process might exist. It's better to make a baseline before running this in production
        - Image|contains: # Example: GoogleUpdate.exe, GoogleCrashHandler.exe, GoogleUpdateComRegisterShell64.exe, Install\{GUID}\setup.exe, chrome_installer.exe
              - ':\Program Files (x86)\Google\'
              - ':\Program Files\Google\'
        - Image|contains|all: # Per-user installation
              - '\AppData\Local\Google\'
              - '\Update\'
    filter_main_installer_temp:
        # Example: C:\Users\<user>\AppData\Local\Temp\GUM7654.tmp\GoogleUpdate.exe -> ...\GUM7654.tmp\GoogleUpdateSetup.exe
        ParentImage|contains: '\Temp\GUM'
        Image|contains: '\Temp\GUM'
        Image|endswith: '\GoogleUpdateSetup.exe'
    filter_main_image_null:
        Image: null
    condition: selection and not 1 of filter_main_*
falsepositives:
    - Unknown
level: high
