title: Windows Sandbox CLI Follow-Up Event (Correlation Base Rule)
name: wsb_followup_event
id: 27157649-a411-4d70-8704-48712de67bc0
status: experimental
description: |
    Base rule for the wsb.exe start+follow-up correlation. Matches on `wsb.exe exec`, `share`, or `connect` invocations.
author: Konrad 'unrooted' Klawikowski
date: 2026-07-22
logsource:
    category: process_creation
    product: windows
detection:
    selection_image:
        - Image|endswith: '\wsb.exe'
        - OriginalFileName: 'wsb.exe'
    keyword:
        CommandLine|contains:
            - ' exec '
            - ' share '
            - ' connect '
    condition: all of selection_* and keyword
fields:
    - CommandLine
    - User
    - ParentImage
falsepositives:
    - This rule is a correlation building block and is not intended to fire on its own; see the correlation rule for false-positive guidance
level: informational
