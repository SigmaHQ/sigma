title: Windows Sandbox CLI Start Event (Correlation Base Rule)
name: wsb_start_event
id: 3556b3d4-2e33-4f52-a6bb-eeaa960f6833
status: experimental
description: |
    Base rule for the wsb.exe start+follow-up correlation. Matches on `wsb.exe start` invocations.
author: Konrad 'unrooted' Klawikowski
date: 2026-07-22
logsource:
    category: process_creation
    product: windows
detection:
    selection_image:
        - Image|endswith: '\wsb.exe'
        - OriginalFileName: 'wsb.exe'
    keyword:
        CommandLine|contains: ' start'
    condition: all of selection_* and keyword
falsepositives:
    - This rule is a correlation building block and is not intended to fire on its own; see the correlation rule for false-positive guidance
level: informational
