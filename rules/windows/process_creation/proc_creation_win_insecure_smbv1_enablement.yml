title: Insecure SMBv1 Protocol Enablement
id: d421ceee-0a4c-4ecd-8e11-0f0478618433
status: experimental
description: Detects attempts to re-enable the deprecated and insecure SMBv1 protocol via PowerShell cmdlets, DISM, or Service Control Manager. Adversaries may enable SMBv1 to exploit legacy vulnerabilities (e.g. EternalBlue) or conduct lateral movement.
references:
    - https://learn.microsoft.com/en-us/windows-server/storage/file-server/troubleshoot/detect-enable-and-disable-smbv1-v2-v3
    - https://www.cisa.gov/news-events/alerts/2017/01/16/risks-using-smbv1
author: Fabian Cras (mboRijnland / CIV Smart Technology)
date: 2026-09-23
tags:
    - attack.defense-evasion
    - attack.lateral-movement
    - attack.t1562.001
    - attack.t1021.002
logsource:
    category: process_creation
    product: windows
detection:
    selection_pwsh_smb_config:
        CommandLine|contains|all:
            - 'Set-SmbServerConfiguration'
            - '-EnableSMB1Protocol'
            - '$true'
    selection_pwsh_feature:
        CommandLine|contains|all:
            - 'Enable-WindowsOptionalFeature'
            - 'SMB1Protocol'
    selection_dism:
        Image|endswith:
            - '\dism.exe'
        CommandLine|contains|all:
            - '/enable-feature'
            - 'SMB1Protocol'
    selection_sc_driver:
        Image|endswith:
            - '\sc.exe'
        CommandLine|contains|all:
            - 'config'
            - 'mrxsmb10'
            - 'start='
    condition: 1 of selection_*
falsepositives:
    - Rare administrative deployment of legacy application dependencies
level: high
