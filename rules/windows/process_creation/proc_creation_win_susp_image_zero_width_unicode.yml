title: Process Image Path Contains Invisible Zero-Width Unicode Characters
id: 21825281-f6d7-4996-99ee-39796a282dec
status: experimental
description: |
    Detects the execution of a process whose image path contains an invisible zero-width Unicode character (U+200B, U+200C, U+200D, U+2060 or U+FEFF).
    Adversaries insert such characters into file names so that a malicious binary looks identical to a legitimate one (e.g. "calc.exe") in Explorer, task lists and during manual triage, while evading exact-match path based allow lists and detections.
references:
    - https://github.com/redcanaryco/atomic-red-team/blob/388942adbd9641f4dfdcf079d7efe9a75ec0ac43/atomics/T1027.018/T1027.018.md
author: elhoim
date: 2026-10-01
tags:
    - attack.stealth
    - attack.t1027.018
    - attack.t1036
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|contains:
            - '​' # U+200B Zero Width Space
            - '‌' # U+200C Zero Width Non-Joiner
            - '‍' # U+200D Zero Width Joiner
            - '⁠' # U+2060 Word Joiner
            - '﻿' # U+FEFF Zero Width No-Break Space (BOM)
    condition: selection
falsepositives:
    - Executables stored in user folders whose names contain emoji sequences, which use the zero-width joiner (U+200D) to combine emoji
level: medium
simulation:
    - type: atomic-red-team
      name: Binary Masquerading via Invisible Unicode
      technique: T1027.018
      atomic_guid: 28e30460-ce18-4974-8e6a-5a2bb74e5c07
