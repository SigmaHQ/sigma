title: DotNet Add-In Pipeline Host Execution
id: a105eab7-d9b9-4fbe-bf81-21b7e78ed7b5
status: experimental
description: Detects execution of the Microsoft .NET Framework add-in pipeline host processes (AddInProcess.exe, AddInProcess32.exe). These signed binaries host managed add-in assemblies and can be abused as LOLBins to proxy execution of managed code inside a Microsoft-signed host process. Distinct from AddInUtil.exe (the deployment cache utility), which is covered by its own rules.
references:
    - https://lolbas-project.github.io/lolbas/Binaries/Addinprocess/
author: kosoyyagent
date: 2026-10-24
tags:
    - attack.stealth
    - attack.t1218
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        - Image|endswith:
              - '\AddInProcess.exe'
              - '\AddInProcess32.exe'
        - OriginalFileName:
              - 'AddInProcess.exe'
              - 'AddInProcess32.exe'
    condition: selection
falsepositives:
    - Legitimate WPF applications that use the .NET add-in framework (MAF). Very uncommon on servers
level: medium
