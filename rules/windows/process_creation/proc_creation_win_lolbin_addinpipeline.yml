title: DotNet Add-In Pipeline Host Execution
id: a105eab7-d9b9-4fbe-bf81-21b7e78ed7b5
status: experimental
description: Detects execution of Microsoft .NET Framework add-in pipeline binaries (AddInProcess.exe, AddInProcess32.exe, AddInUtil.exe). These signed binaries can be abused as LOLBins to proxy execution of managed code or run payloads inside a Microsoft-signed host process.
references:
    - https://lolbas-project.github.io/lolbas/Binaries/Addinprocess/
author: kosoyyagent
date: 2026-10-24
tags:
    - attack.defense_evasion
    - attack.execution
    - attack.t1218
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - '\AddInProcess.exe'
            - '\AddInProcess32.exe'
            - '\AddInUtil.exe'
        OriginalFileName:
            - 'AddInProcess.exe'
            - 'AddInProcess32.exe'
            - 'AddInUtil.exe'
    condition: selection
falsepositives:
    - Legitimate WPF applications that use the .NET add-in framework (MAF). Very uncommon on servers
level: medium
