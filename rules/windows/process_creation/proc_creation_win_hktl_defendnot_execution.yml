title: HackTool - Defendnot Execution
id: 0aaa9689-9f38-491d-bd4d-a9af6eb43138
status: experimental
description: |
    Detects the execution of the hacktool Defendnot. Defendnot is a hacktool that abuses Microsoft undocumented WSC (Windows Security Center) API
    to disable Windows Defender by registering itself as a fake antivirus product. Threat actors often use these kind of tools to bypass security measures.
references:
    - https://github.com/es3n1n/defendnot/blob/525176a37721ead27d3f9f77f59b58abfc305988/README.md
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2026-09-27
tags:
    - attack.defense-impairment
    - attack.t1685
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        - Image|contains: 'defendnot'
        - CommandLine|contains: 'defendnot'
        - Hashes|contains:
              - 'IMPHASH=7ec4023c85149450ab388f0837192fe0'
              - 'IMPHASH=75002197e0d24aaf0b8c6a1bf68513d6'
              - 'IMPHASH=1faaed26690a9455a795e2215661726f'
              - 'IMPHASH=6cedec3562fef2dc2f959a1d0bf54db8'
    condition: selection
falsepositives:
    - Unlikely
level: high
