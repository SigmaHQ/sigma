title: Applaunch ClickOnce Activation
id: 34465f76-30d9-4e6f-acca-8c449f2213b1
related:
    - id: e593cf51-88db-4ee1-b920-37e89012a3c9
      type: similar
status: experimental
description: Detects the execution of the LOLBIN Applaunch outside of the ClickOnce service dfsvc.exe, which can be used to activate arbitrary ClickOnce applications
references:
    - https://lolbas-project.github.io/lolbas/Binaries/Applaunch/
    - https://nathan2.com/posts/clicktools
    - https://github.com/nasawyer7/clicktools/tree/240e1edcf9491cd565750758a6db59c553ef8e4b
author: Jirayu Thongchotchaung
date: 2026-08-24
tags:
    - attack.execution
    - attack.stealth
    - attack.t1127.002
logsource:
    product: windows
    category: process_creation
detection:
    selection_img:
        - Image|endswith: '\Applaunch.exe'
        - OriginalFileName: 'applaunch.exe'
    selection_cli:
        CommandLine|contains:
            - ' /activate'
            - ' -activate'
    filter_main_dfsvc:
        ParentImage|endswith: '\dfsvc.exe'
    condition: all of selection_* and not 1 of filter_main_*
falsepositives:
    - Legitimate activation of ClickOnce applications by development or deployment tooling
level: medium
