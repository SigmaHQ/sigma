title: Potential Data Exfiltration To Chat Service Webhook Via CommandLine
id: 6293e711-ebf5-4dd8-a1c0-4414679d75a8
status: experimental
description: |
    Detects command lines that reference a Discord, Slack or Microsoft Teams incoming webhook URL or the Telegram Bot API, e.g. "curl.exe -F file=@..." or "Invoke-RestMethod -Method Post".
    Infostealers and adversaries abuse these webhooks as an easy, authenticated-by-URL exfiltration channel to reputable domains that are rarely blocked.
references:
    - https://discord.com/developers/docs/resources/webhook
    - https://api.slack.com/messaging/webhooks
    - https://core.telegram.org/bots/api
    - https://github.com/redcanaryco/atomic-red-team/blob/388942adbd9641f4dfdcf079d7efe9a75ec0ac43/atomics/T1567.004/T1567.004.md
author: elhoim
date: 2026-10-01
tags:
    - attack.exfiltration
    - attack.t1567.004
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        CommandLine|contains:
            - 'api.telegram.org/bot' # Telegram Bot API
            - 'discord.com/api/webhooks/' # Also covers canary/ptb sub domains
            - 'discordapp.com/api/webhooks/'
            - 'hooks.slack.com/services/'
            - '.webhook.office.com/webhookb2/' # Microsoft Teams incoming webhook
    condition: selection
falsepositives:
    - Legitimate automation, monitoring or CI/CD scripts that post notifications to Slack, Microsoft Teams, Discord or Telegram channels
level: medium
simulation:
    - type: atomic-red-team
      name: Exfiltrate staged data to a Discord webhook (PowerShell)
      technique: T1567.004
      atomic_guid: f0057c81-24dc-4a2e-b658-5809c242180b
    - type: atomic-red-team
      name: Exfiltrate staged data to a Microsoft Teams webhook (PowerShell)
      technique: T1567.004
      atomic_guid: 35ad6590-2207-4b14-bf8f-9899470d7156
