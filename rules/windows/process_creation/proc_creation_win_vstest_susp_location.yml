title: Potential Proxy Execution Via VSTest From Suspicious Location
id: 388d9887-45c5-43ad-a643-306c715eb385
status: experimental
description: Detects Microsoft VSTest Console executing a test assembly from a potentially suspicious user-writable directory. Adversaries may abuse VSTest to execute code embedded in a crafted test assembly.
references:
    - https://learn.microsoft.com/en-us/visualstudio/test/vstest-console-options
    - https://lolbas-project.github.io/lolbas/OtherMSBinaries/Vstest.console/
author: Nazar Diachok (@Diablo-research)
date: 2026-10-07
tags:
    - attack.execution
    - attack.stealth
    - attack.t1127
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        - Image|endswith: '\vstest.console.exe'
        - OriginalFileName: 'vstest.console.exe'
    selection_path:
        CommandLine|contains:
            - '\AppData\Local\Temp\'
            - ':\Temp\'
            - ':\Windows\Temp\'
            - '\Users\Public\'
            - '\Downloads\'
            - '\Desktop\'
    selection_extension:
        CommandLine|contains:
            - '.dll'
            - '.exe'
    condition: all of selection_*
falsepositives:
    - Legitimate software testing or CI workflows that execute test assemblies from temporary or other user-writable directories.
level: medium
