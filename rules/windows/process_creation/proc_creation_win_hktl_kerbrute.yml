title: HackTool - Kerbrute Execution
id: 65584b02-bc8b-49e0-bea2-2977b48999b5
status: experimental
description: |
    Detects the execution of Kerbrute, a tool used to enumerate valid Active Directory accounts and to brute-force or spray passwords via Kerberos Pre-Authentication.
    Its "userenum" mode enumerates valid domain usernames without generating failed logon events (Event ID 4625), making it a stealthy discovery technique, while its "passwordspray", "bruteuser" and "bruteforce" modes increment failed login counters and can lock out accounts.
    Beyond red team usage, the tool has been observed in real intrusions and has been associated with RansomHub ransomware operations, the FIN12 threat actor group and Alloy Taurus.
references:
    - https://github.com/ropnop/kerbrute
    - https://www.securonix.com/blog/hunting-kerbrute-analysis-detection-and-mitigation-of-kerberos-attacks-in-active-directory/
    - https://raxis.com/blog/cool-tools-series-kerbrute/
author: Ashish Pulivarthy (ashish-cybersec)
date: 2026-07-10
tags:
    - attack.credential-access
    - attack.t1110
    - attack.discovery
    - attack.t1087.002
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith:
            - '\kerbrute.exe'
            - '\kerbrute_windows_386.exe'
            - '\kerbrute_windows_amd64.exe'
    selection_cli_subcommand:
        CommandLine|contains:
            - ' userenum '
            - ' passwordspray '
            - ' bruteuser '
            - ' bruteforce '
    selection_cli_flags:
        CommandLine|contains:
            - ' --dc '
            - ' -d '
            - ' --domain '
    condition: selection_img or all of selection_cli_*
falsepositives:
    - Unlikely. Kerbrute has no legitimate administrative use outside of authorised red team engagements.
level: high
regression_tests_path: regression_data/rules/windows/process_creation/proc_creation_win_hktl_kerbrute/info.yml
