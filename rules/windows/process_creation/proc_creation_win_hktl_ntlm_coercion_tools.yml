title: Potential NTLM Authentication Coercion Tool Execution
id: bfda903c-f36f-432b-ae0f-fba97afc34a8
related:
    - id: 5589ab4f-a767-433c-961d-c91f3f704db1
      type: similar
status: experimental
description: |
    Detects execution of tools that coerce NTLM authentication by abusing Windows RPC interfaces.
    These tools force a target machine, typically a Domain Controller, to authenticate to an attacker-controlled listener with its machine account.
    The captured authentication can then be relayed, which may lead to full domain compromise.
    Covered tools are DFSCoerce (MS-DFSNM), ShadowCoerce (MS-FSRVP), WSPCoerce (MS-WSP) and Coercer, which automates coercion over multiple RPC interfaces.
references:
    - https://github.com/Wh04m1001/DFSCoerce
    - https://github.com/ShutdownRepo/ShadowCoerce
    - https://github.com/RedTeamPentesting/wspcoerce
    - https://github.com/p0dalirius/Coercer
    - https://blog.redteam-pentesting.de/2025/windows-coercion/
author: Ashish Pulivarthy (ashish-cybersec)
date: 2026-07-03
tags:
    - attack.credential-access
    - attack.t1187
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|contains:
            - 'DFSCoerce'
            - 'ShadowCoerce'
            - 'WSPCoerce'
    selection_cli_scripts:
        CommandLine|contains:
            - 'dfscoerce.py'
            - 'shadowcoerce.py'
    selection_cli_coercer:
        CommandLine|contains:
            - 'coercer coerce '
            - 'coercer scan '
            - 'coercer fuzz '
            - 'coercer.py coerce '
            - 'coercer.py scan '
            - 'coercer.py fuzz '
    condition: 1 of selection_*
falsepositives:
    - Unknown
level: high
