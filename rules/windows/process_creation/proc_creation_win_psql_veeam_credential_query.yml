title: Potential Veeam PostgreSQL Credential Table Query Via Psql.EXE
id: e0d60916-a8dc-4a3a-a6a9-acfd8c10e00e
related:
    - id: b57ba453-b384-4ab9-9f40-1038086b4e53
      type: similar
    - id: 696bfb54-227e-4602-ac5b-30d9d2053312
      type: similar
status: experimental
description: >
    Detects the PostgreSQL psql client executing a SELECT query against the
    credentials table in the VeeamBackup database. Similar credential access
    was documented in an Akira ransomware intrusion. Legitimate Veeam credential
    recovery procedures may also produce this activity.
references:
    - https://thedfirreport.com/2026/06/29/from-bing-search-to-ransomware-bumblebee-and-adaptixc2-deliver-akira-3/
    - https://www.veeam.com/kb4349
author: Brandon Chaney
date: 2026-10-14
tags:
    - attack.credential-access
    - attack.t1555
    - attack.collection
    - attack.t1005
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith: '\psql.exe'
    selection_db:
        # Matches -d VeeamBackup or --dbname=VeeamBackup.
        CommandLine|re|i: '\s(?:-d\s+|--dbname(?:=|\s+))"?VeeamBackup"?(?:\s|$)'
    selection_select:
        CommandLine|re|i: 'select\s'
    selection_table:
        # Table boundary avoids matching FROM credentials_backup.
        # Handles unquoted / quoted schema qualifiers and table identifiers.
        CommandLine|re|i: 'from\s+(?:(?:[a-z_][a-z0-9_]*|"[a-z_][a-z0-9_]*")\.)?"?credentials"?(?:\s|[,;)"]|$)'
    condition: all of selection_*
falsepositives:
    - Authorized Veeam credential recovery or database troubleshooting, as described in Veeam KB4349.
level: medium
