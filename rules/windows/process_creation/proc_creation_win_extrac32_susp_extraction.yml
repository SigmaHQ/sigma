title: Suspicious Extrac32 Execution Alternate Data Streams or Extraction
id: d8f49b1e-6273-4c91-b3b4-123456789abc
status: experimental
description: Detects the execution of extrac32.exe to extract CAB files or copy files to suspicious directories or alternate data streams.
references:
    - https://lolbas-project.github.io/lolbas/Binaries/Extrac32/
    - https://attack.mitre.org/techniques/T1218/
author: RealFiras
date: 2026/11/19
tags:
    - attack.defense_evasion
    - attack.t1218
    - attack.t1105
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        - Image|endswith: '\extrac32.exe'
        - OriginalFileName: 'extrac32.exe'
    selection_cli:
        CommandLine|contains:
            - '/C'
            - '/Y'
            - 'AppData\Local\Temp'
            - 'C:\Users\Public\'
            - 'C:\ProgramData\'
    condition: selection_img and selection_cli
falsepositives:
    - Legitimate software installers extracting temporary setup archives.
level: medium
