title: Cloud Instance Metadata Credential Or Token Request Via CommandLine - Windows
id: 73ba98d8-0f2a-4a98-931e-b72ea935b817
status: experimental
description: |
    Detects command lines that query a cloud instance metadata service (IMDS) endpoint for IAM role credentials, managed identity tokens, service account tokens or instance metadata, e.g. via "Invoke-RestMethod", "Invoke-WebRequest" or "curl.exe".
    Adversaries with code execution on a cloud hosted Windows VM query the IMDS (169.254.169.254) to steal the credentials of the identity attached to the instance and pivot into the cloud control plane.
references:
    - https://learn.microsoft.com/en-us/azure/virtual-machines/instance-metadata-service
    - https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/instance-metadata-security-credentials.html
    - https://cloud.google.com/compute/docs/access/authenticate-workloads
    - https://github.com/redcanaryco/atomic-red-team/blob/388942adbd9641f4dfdcf079d7efe9a75ec0ac43/atomics/T1552.005/T1552.005.md
author: elhoim
date: 2026-10-01
tags:
    - attack.credential-access
    - attack.t1552.005
logsource:
    category: process_creation
    product: windows
detection:
    selection_host:
        CommandLine|contains:
            - '169.254.169.254'
            - 'fd00:ec2::254'
            - 'metadata.google.internal'
    selection_path:
        CommandLine|contains:
            - '/computeMetadata/v1/instance/service-accounts' # GCP
            - '/latest/api/token' # AWS IMDSv2 session token
            - '/latest/meta-data/iam/security-credentials' # AWS
            - '/latest/user-data' # AWS
            - '/metadata/identity/oauth2/token' # Azure managed identity
            - '/metadata/instance' # Azure
    condition: all of selection_*
falsepositives:
    - Cloud provider guest agents, bootstrap or configuration management scripts that query the instance metadata service
    - Administrators troubleshooting instance roles or managed identities
level: medium
simulation:
    - type: atomic-red-team
      name: Azure - Dump Azure Instance Metadata from Virtual Machines
      technique: T1552.005
      atomic_guid: cc99e772-4e18-4f1f-b422-c5cdd1bfd7b7
