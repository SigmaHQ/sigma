title: Suspicious Child Process Of Ntsd.EXE
id: 2ead58ff-53ba-443c-ba82-87c0ec698b1f
related:
    - id: b5c7395f-e501-4a08-94d4-57fe7a9da9d2 # Cdb proxy execution
      type: similar
status: experimental
description: |
    Detects "ntsd.exe" (Microsoft NT Symbolic Debugger) spawning a shell or a common LOLBIN as a child process.
    Attackers can abuse this signed debugger to proxy execution of arbitrary commands, for example via the "-g" flag.
references:
    - https://lolbas-project.github.io/lolbas/OtherMSBinaries/Ntsd/
author: Aditi Nagpure
date: 2026-10-27
tags:
    - attack.execution
    - attack.stealth
    - attack.t1127
logsource:
    category: process_creation
    product: windows
detection:
    selection_parent:
        ParentImage|endswith: '\ntsd.exe'
    selection_child:
        - Image|endswith:
              - '\cmd.exe'
              - '\cscript.exe'
              - '\mshta.exe'
              - '\powershell.exe'
              - '\pwsh.exe'
              - '\regsvr32.exe'
              - '\rundll32.exe'
              - '\wscript.exe'
        - OriginalFileName:
              - 'Cmd.Exe'
              - 'cscript.exe'
              - 'MSHTA.EXE'
              - 'PowerShell.EXE'
              - 'pwsh.dll'
              - 'REGSVR32.EXE'
              - 'RUNDLL32.EXE'
              - 'wscript.exe'
    condition: all of selection_*
falsepositives:
    - Developers debugging scripts or command-line tools with ntsd
level: medium
regression_tests_path: regression_data/rules/windows/process_creation/proc_creation_win_ntsd_susp_child_process/info.yml
