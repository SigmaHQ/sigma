title: Suspicious Rundll32 Execution With Image Extension
id: 4aa6040b-3f28-44e3-a769-9208e5feb5ec
related:
    - id: 089fc3d2-71e8-4763-a8a5-c97fbb0a403e
      type: similar
status: test
description: Detects the execution of Rundll32.exe with DLL files masquerading as image files
references:
    - https://www.zscaler.com/blogs/security-research/onenote-growing-threat-malware-distribution
author: Hieu Tran
date: 2023-03-13
modified: 2026-10-26
tags:
    - attack.stealth
    - attack.t1218.011
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        - Image|endswith: '\rundll32.exe'
        - OriginalFileName: 'RUNDLL32.exe'
    selection_cli:
        CommandLine|contains:
            - '.bmp'
            - '.cr2'
            - '.eps'
            - '.gif'
            - '.ico'
            - '.jpeg'
            - '.jpg'
            - '.nef'
            - '.orf'
            - '.png'
            - '.raw'
            - '.sr2'
            - '.tif'
            - '.tiff'
    filter_main_webdav_client:
        # The WebClient service runs "rundll32 davclnt.dll,DavSetCookie <host> <url>" for each WebDAV request; the URL is often an image (e.g. folder.jpg thumbnails), the DLL is davclnt.dll
        CommandLine|contains: 'C:\Windows\system32\davclnt.dll,DavSetCookie '
    condition: all of selection_* and not 1 of filter_main_*
falsepositives:
    - Unknown
level: high
