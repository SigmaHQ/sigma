title: Clear PowerShell History - PowerShell
id: 26b692dc-1722-49b2-b496-a8258aa6371d
related:
    - id: f99276ad-d122-4989-a09a-d00904a5f9d2
      type: similar
    - id: 8b1f125c-c933-46d0-a510-1ab15cc45326
      type: similar
status: test
description: Detects keywords that could indicate clearing PowerShell history
references:
    - https://gist.github.com/hook-s3c/7363a856c3cdbadeb71085147f042c1a
    - https://securelist.ru/tr/hacking-cat/117062/
author: Ilyas Ochkov, Jonhnathan Ribeiro, Daniil Yugoslavskiy, oscd.community
date: 2022-01-25
modified: 2026-10-02
tags:
    - attack.stealth
    - attack.t1070.003
logsource:
    product: windows
    category: ps_script
    definition: 'Requirements: Script Block Logging must be enabled'
detection:
    selection_del_cmdlet:
        ScriptBlockText|contains:
            - 'del '
            - 'Remove-Item '
            - 'rm '
    selection_del_file:
        ScriptBlockText|contains:
            - '(Get-PSReadlineOption).HistorySavePath'
            - 'ConsoleHost_history.txt'
    selection_disable_history:
        ScriptBlockText|contains|all:
            - 'Set-PSReadlineOption'
            - 'HistorySaveStyle'
            - 'SaveNothing'
    condition: all of selection_del_* or selection_disable_history
falsepositives:
    - Legitimate PowerShell scripts
level: medium
