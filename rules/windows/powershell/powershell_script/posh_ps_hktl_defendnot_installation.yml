title: HackTool - Defendnot Installation via PowerShell One-Liner
id: 50b159ba-a147-40f7-9d11-561e724b8a2e
status: experimental
description: |
    Detects execution of Defendnot installation via PowerShell one-liner that downloads and executes the Defendnot script from a remote URL.
    Defendnot is a hacktool that abuses Microsoft's undocumented WSC API to disable Windows Defender by registering itself as a fake antivirus product.
references:
    - https://github.com/es3n1n/defendnot/blob/525176a37721ead27d3f9f77f59b58abfc305988/README.md#one-liner
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2026-09-27
tags:
    - attack.defense-impairment
    - attack.t1685
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        - ScriptBlockText|contains: 'https://dnot.sh/'
        - ScriptBlockText|contains|all:
              - '/defendnot'
              - 'github' # covers both api.github.com and raw.githubusercontent.com
    condition: selection
falsepositives:
    - Unlikely
level: high
