title: Powershell Create Scheduled Task
id: 363eccc0-279a-4ccf-a3ab-24c2e63b11fb
related:
    - id: 3a00e18c-bde4-4e81-bc8f-500e24c720a6
      type: similar
status: test
description: |
    Detects the powershell one-liners that create scheduled tasks via the command line.
    Covers native PowerShell cmdlets (e.g. Register-ScheduledTask), the WMI/CIM method,
    and the Schedule.Service COM object. Threat actors might use powershell to create
    scheduled tasks instead of schtasks esp, via cimmethod or COM object which are very
    uncommon method and often avoid detections.
references:
    - https://cloud.google.com/blog/topics/threat-intelligence/new-malware-russia-coldriver
    - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1053.005/T1053.005.md#atomic-test-4---powershell-cmdlet-scheduled-task
    - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1053.005/T1053.005.md#atomic-test-6---wmi-invoke-cimmethod-scheduled-task
author: frack113
date: 2021-12-28
modified: 2026-08-25
tags:
    - attack.privilege-escalation
    - attack.execution
    - attack.persistence
    - attack.t1053.005
logsource:
    product: windows
    category: ps_script
    definition: 'Requirements: Script Block Logging must be enabled'
detection:
    selection_cmdlet:
        ScriptBlockText|contains:
            - 'New-ScheduledTaskAction'
            - 'New-ScheduledTaskTrigger'
            - 'New-ScheduledTaskPrincipal'
            - 'New-ScheduledTaskSettingsSet'
            - 'New-ScheduledTask'
            - 'Register-ScheduledTask'
    selection_cimmethod:
        ScriptBlockText|contains|all:
            - 'Invoke-CimMethod'
            - '-ClassName'
            - 'PS_ScheduledTask'
            - '-NameSpace'
            - 'Root\Microsoft\Windows\TaskScheduler'
    selection_com:
        ScriptBlockText|contains|all:
            - '-ComObject'
            - 'Schedule.Service'
            - 'RegisterTaskDefinition'
    filter_main_legitimate_scripts:
        ScriptBlockText|contains|all:
            - 'Microsoft.PowerShell.Core\Export-ModuleMember'
            - 'Microsoft.Management.Infrastructure.CimInstance'
            - '__cmdletization_methodParameter'
    filter_main_com_packer_update:
        ScriptBlockText|contains|all:
            - 'Schedule.Service'
            - 'packer-windows-update-'
            - '-EncodedCommand QwA6AC8AVwBpAG4AZABvAHcAcwAvAFQAZQBtAHAALwBwAGEAYwBr'
    condition: 1 of selection_* and not 1 of filter_main_*
falsepositives:
    - Unknown
level: medium
regression_tests_path: regression_data/rules/windows/powershell/powershell_script/posh_ps_cmdlet_scheduled_task/info.yml
