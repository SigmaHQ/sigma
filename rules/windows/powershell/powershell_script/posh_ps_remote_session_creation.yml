title: PowerShell Remote Session Creation
id: a0edd39f-a0c6-4c17-8141-261f958e8d8f
status: test
description: |
    Adversaries may abuse PowerShell commands and scripts for execution.
    PowerShell is a powerful interactive command-line interface and scripting environment included in the Windows operating system
references:
    - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1059.001/T1059.001.md#atomic-test-10---powershell-invoke-downloadcradle
    - https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.core/new-pssession?view=powershell-7.4
author: frack113
date: 2022-01-06
modified: 2026-10-14
tags:
    - attack.execution
    - attack.t1059.001
logsource:
    product: windows
    category: ps_script
    definition: 'Requirements: Script Block Logging must be enabled'
detection:
    selection:
        ScriptBlockText|contains|all:
            - 'New-PSSession'
            - '-ComputerName '
    filter_optional_bccontainerhelper:
        # Microsoft BcContainerHelper (Business Central container module) opens a WinRM session to a local container
        Path|contains: '\Modules\BcContainerHelper\'
        ScriptBlockText|contains: '$bcContainerHelperConfig.WinRmCredentials'
    condition: selection and not 1 of filter_optional_*
falsepositives:
    - Legitimate administrative script
    - Microsoft Dynamics 365 Business Central BcContainerHelper module
level: medium
regression_tests_path: regression_data/rules/windows/powershell/powershell_script/posh_ps_remote_session_creation/info.yml
