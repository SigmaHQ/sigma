title: Potential Cmdlet Invocation Via ExportedCommands Array Index
id: 4ff4ad3e-9fb5-4a70-9962-d6ea58090318
status: experimental
description: |
    Detects PowerShell scripts that enumerate Microsoft.PowerShell.Utility exported commands
    and invoke cmdlets indirectly by array index. This can be used to evade detections
    that look for explicit strings such as Invoke-RestMethod or Invoke-Expression.
references:
    - https://detect.fyi/hunting-clickfix-initial-access-techniques-8c1b38d5ef9b
    - https://www.csoonline.com/article/4141923/clickfix-attackers-using-new-tactic-to-evade-detection-says-microsoft.html
    - https://www.hhs.gov/sites/default/files/clickfix-attacks-sector-alert-tlpclear.pdf
    - https://www.proofpoint.com/us/blog/threat-insight/clipboard-compromise-powershell-self-pwn
author: Norbert Jaśniewicz (AlphaSOC)
date: 2026-06-11
tags:
    - attack.execution
    - attack.stealth
    - attack.t1027
    - attack.t1059.001
logsource:
    product: windows
    category: ps_script
    definition: 'Requirements: Script Block Logging must be enabled'
detection:
    selection_module_export_enum:
        ScriptBlockText|contains|all:
            - 'Get-Module'
            - 'ListAvailable'
            - 'Microsoft.PowerShell.Utility'
            - 'ExportedCommands'
            - 'Values'
    selection_index_used:
        ScriptBlockText|contains: '[*]'
    condition: all of selection_*
falsepositives:
    - Legitimate module inventory/inspection scripts
    - Legitimate dynamic cmdlet invocation via array index
    - Module development/debugging scripts
level: medium
