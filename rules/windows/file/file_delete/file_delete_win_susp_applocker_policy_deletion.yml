title: Suspicious Deletion of AppLocker Policy Files
id: f2a8c3e4-1d5b-4a9c-8f6e-2b3c7d8a9f1e
related:
    - id: c1c2f4e2-0f3d-4c8e-9b8a-6f2a1d9c4e77
      type: similar
status: experimental
description: Detects suspicious deletion of AppLocker policy files which may indicate tampering or attempts to disable application control.
references:
    - https://learn.microsoft.com/windows/security/threat-protection/applocker/applocker-overview
author: Reinhard Westerholt
date: 2026-03-02
tags:
    - attack.defense-impairment
    - attack.t1685.02
logsource:
    product: windows
    category: file_delete
detection:
    selection_paths:
        TargetFilename|contains: '\System32\AppLocker\'
    selection_image:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\cmd.exe'
            - '\wscript.exe'
            - '\cscript.exe'
            - '\mshta.exe'
            - '\python.exe'
            - '\rundll32.exe'
    condition: selection_paths and selection_image
falsepositives:
    - Administrators re-applying or repairing an AppLocker policy from a shell or script
level: high
