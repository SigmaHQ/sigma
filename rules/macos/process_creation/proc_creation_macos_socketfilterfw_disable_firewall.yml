title: Application Firewall Disabled Via Socketfilterfw
id: 6D7E6BA1-EC0D-4633-B558-B74349C91629
status: experimental
description: |
    Detects disabling of the built-in macOS Application Firewall via
    "socketfilterfw --setglobalstate off". Adversaries disable the firewall to
    weaken host defenses and permit inbound/outbound connections for tooling or C2.
references:
    - https://www.manpagez.com/man/8/socketfilterfw/
author: Garrett Allen
date: 2026-07-25
tags:
    - attack.defense-evasion
    - attack.t1562.004
logsource:
    category: process_creation
    product: macos
detection:
    selection:
        Image|endswith: '/socketfilterfw'
        CommandLine|contains|all:
            - 'setglobalstate'
            - 'off'
    condition: selection
falsepositives:
    - Legitimate administrative changes to the firewall configuration
level: medium