title: Multiple Dscl Authonly Executions By The Same User
id: c4d9b6e2-8a17-4f03-9e5b-2f6a1d8c7b39
related:
    - id: 7f3a1c2e-9b4d-4e2a-8c6f-1d5e7a9b3c4f
      type: similar
status: experimental
description: |
    Detects repeated dscl -authonly executions by the same user on the same host within a
    short window, which is consistent with local password guessing or with a stealer that
    re-prompts and re-validates until it receives a working password.
    Built on the single-event rule, so it inherits its root exclusion. The threshold and
    window are starting values and should be tuned against your baseline.
references:
    - https://ss64.com/mac/dscl.html
    - https://www.jamf.com/blog/crashstealer-macos-infostealer-analysis/
author: Pavan Pothamsetti (PpT2211)
date: 2026-11-21
tags:
    - attack.credential-access
    - attack.t1110.001
correlation:
    type: event_count
    rules:
        - 7f3a1c2e-9b4d-4e2a-8c6f-1d5e7a9b3c4f
    group-by:
        - Computer
        - User
    timespan: 5m
    condition:
        gte: 5
falsepositives:
    - Scripts that validate credentials for several accounts in a loop in the user context
level: medium