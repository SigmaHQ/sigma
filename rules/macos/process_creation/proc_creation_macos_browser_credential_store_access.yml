title: Potential Browser Credential and Cookie Store Access - macOS
id: f0fba1f3-972d-4209-b652-9fd7196281ab
status: experimental
description: |
    Detects processes reading or copying browser credential and cookie databases from user profile directories on macOS.
    macOS infostealers such as Atomic Stealer (AMOS) copy Chromium and Firefox profile artifacts including "Login Data", "Cookies" and "Web Data" into a staging directory before archiving and exfiltrating them.
references:
    - https://www.trendmicro.com/en_us/research/25/i/an-mdr-analysis-of-the-amos-stealer-campaign.html
    - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1555.003/T1555.003.md
author: Yana Ivanov
date: 2026-10-10
tags:
    - attack.credential-access
    - attack.t1555.003
    - attack.t1539
logsource:
    category: process_creation
    product: macos
detection:
    selection_profile_path:
        CommandLine|contains:
            - 'Library/Application Support/Google/Chrome'
            - 'Library/Application Support/Chromium'
            - 'Library/Application Support/BraveSoftware'
            - 'Library/Application Support/Microsoft Edge'
            - 'Library/Application Support/Vivaldi'
            - 'Library/Application Support/Opera Software'
            - 'Library/Application Support/Firefox/Profiles'
    selection_artifact:
        CommandLine|contains:
            - 'Login Data'
            - 'Cookies'
            - 'Web Data'
            - 'cookies.sqlite'
            - 'logins.json'
            - 'key4.db'
    condition: all of selection_*
falsepositives:
    - Backup, migration or endpoint management tooling that copies user profile data
    - Browser profile synchronisation or recovery utilities
    - Administrators or developers inspecting browser profile databases
level: medium
