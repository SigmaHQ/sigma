title: Microsoft 365 Email Protection Policy Disabled or Removed
id: 5063cb00-5d44-4d6d-ae79-aed940901a61
status: experimental
description: |
  Detects disabling or deletion of Microsoft Defender for Office 365 protection
  policies and their associated rules, including anti-phishing, Safe Links,
  Safe Attachments, anti-spam, anti-malware, and preset security policies.
  Adversaries disable these controls to allow phishing or malicious payloads
  to reach mailboxes prior to delivery.
references:
    - https://github.com/vectra-ai-research/MAAD-AF
    - https://learn.microsoft.com/en-us/powershell/module/exchange/disable-antiphishrule
author: Tashnim Asgar (@lanceterminal)
date: 2026-09-11
tags:
    - attack.t1685
logsource:
    product: m365
    service: exchange
detection:
    selection_disable:
        eventName:
            - 'Disable-AntiPhishRule'
            - 'Disable-SafeLinksRule'
            - 'Disable-SafeAttachmentRule'
            - 'Disable-HostedContentFilterRule'
            - 'Disable-MalwareFilterRule'
            - 'Disable-ATPProtectionPolicyRule'
            - 'Disable-EOPProtectionPolicyRule'
    selection_remove:
        eventName:
            - 'Remove-AntiPhishRule'
            - 'Remove-AntiPhishPolicy'
            - 'Remove-SafeLinksRule'
            - 'Remove-SafeAttachmentRule'
            - 'Remove-HostedContentFilterRule'
            - 'Remove-MalwareFilterRule'
    selection_weaken:
        eventName:
            - 'Set-AntiPhishPolicy'
            - 'Set-SafeLinksPolicy'
            - 'Set-SafeAttachmentPolicy'
            - 'Set-MalwareFilterPolicy'
        eventData|contains:
            - 'EnableMailboxIntelligence", "Value": "False'
            - 'EnableSpoofIntelligence", "Value": "False'
            - 'EnableTargetedUserProtection", "Value": "False'
            - 'Enabled", "Value": "False'
    filter_main_success:
        status: 'Failed'
    condition: 1 of selection_* and not 1 of filter_main_*
falsepositives:
    - Migration from custom policies to Preset Security Policies (Standard/Strict)
    - Deliberate disabling of MDO policies when deploying a third-party email
      security gateway
    - CSP/GDAP partner activity during tenant onboarding (check ExternalAccess)
    - Documented change windows and policy tuning
level: high
