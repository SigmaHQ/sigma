title: AWS IAM Role Trust Policy Modified
id: 843688ba-bbe9-44ca-8986-183a24c9f734
status: experimental
description: |
    Detects modification of an IAM role trust policy via the UpdateAssumeRolePolicy API call.
    The trust policy is what decides which principals are allowed to assume a role. An attacker who can call this API on a privileged role can add their own principal, including one in an account they control, and then assume that role at will without touching any permission policy or creating any new identity.
    This is a persistence and privilege escalation path that leaves the role's attached policies untouched, so it is not visible to detections that watch policy attachment, inline policies or policy versions.
references:
    - https://logtriage.app/rules/cloudtrail-iam-privilege-escalation/
    - https://rhinosecuritylabs.com/aws/aws-privilege-escalation-methods-mitigation/
    - https://docs.aws.amazon.com/IAM/latest/APIReference/API_UpdateAssumeRolePolicy.html
    - https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_terms-and-concepts.html
author: LogTriage
date: 2026-09-21
tags:
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1098.003
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: 'iam.amazonaws.com'
        eventName: 'UpdateAssumeRolePolicy'
    filter_main_aws_service:
        userIdentity.type: 'AWSService'
    condition: selection and not 1 of filter_main_*
falsepositives:
    - Infrastructure as code pipelines such as Terraform or CloudFormation that manage role trust relationships. Baseline which principals legitimately update trust policies and filter on userIdentity.arn
    - Account bootstrap, landing zone provisioning and cross account role onboarding
level: medium
