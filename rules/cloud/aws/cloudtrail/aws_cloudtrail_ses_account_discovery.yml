title: AWS SES Account Availability Discovery Via Long-Lived Access Key
id: 5f75f934-e78a-4653-9d3a-50e799af9edc
status: experimental
description: |
    Detects SES account availability discovery via CloudTrail using a long-term AWS access key.
    Adversaries call these APIs to learn whether a compromised SES account is still restricted to the sandbox, where email can only be sent to verified addresses and volume is capped at 200 messages per day, or is already in production mode, where it can send to arbitrary recipients with a quota typically raised to 50,000 emails per day.
    An account in production mode lets the attacker send phishing from the victim's verified domains, shifting the sending cost and the reputational damage onto the victim.
references:
    - https://www.wiz.io/blog/wiz-discovers-cloud-email-abuse-campaign
    - https://www.datadoghq.com/blog/detect-phishing-activity-amazon-ses/
    - https://docs.aws.amazon.com/ses/latest/APIReference/API_GetSendQuota.html
    - https://docs.aws.amazon.com/ses/latest/APIReference-V2/API_GetAccount.html
    - https://docs.aws.amazon.com/ses/latest/APIReference/API_ListIdentities.html
author: Marco Pedrinazzi (@pedrinazziM)
date: 2026-06-02
tags:
    - attack.discovery
    - attack.t1526
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: 'ses.amazonaws.com'
        eventName:
            - 'GetSendQuota'
            - 'GetAccount'
            - 'ListIdentities'
        userIdentity.accessKeyId|startswith: 'AKIA'
    condition: selection
falsepositives:
    - Legitimate SES administration monitoring operations
level: medium
