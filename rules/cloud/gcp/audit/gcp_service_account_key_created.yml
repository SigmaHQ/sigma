title: Google Cloud Service Account Key Created
id: 59faa99a-449c-4af4-b80f-e3e378ecb0ee
status: experimental
description: |
    Detects the creation of a user managed service account key in Google Cloud.
    A user managed key is a long lived credential that never expires on its own and can be used from anywhere on the internet, so minting one is a common persistence and privilege escalation step once a principal or a build pipeline has been compromised.
    Google recommends workload identity federation or short lived credentials instead of static keys, so in most environments this call should be rare and attributable.
references:
    - https://logtriage.app/rules/gcp-iam-privilege-escalation/
    - https://docs.cloud.google.com/iam/docs/audit-logging
    - https://docs.cloud.google.com/iam/docs/best-practices-for-managing-service-account-keys
author: LogTriage
date: 2026-09-21
tags:
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1098.001
logsource:
    product: gcp
    service: gcp.audit
detection:
    selection:
        gcp.audit.method_name: 'google.iam.admin.v1.CreateServiceAccountKey'
    condition: selection
falsepositives:
    - Provisioning of a legacy workload or third party integration that genuinely requires a static key
    - Infrastructure as code pipelines that create and rotate service account keys
level: medium
