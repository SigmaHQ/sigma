title: Credentials Added To Service Principal
id: ebe2b9ca-4603-42a0-8894-9789d5daf1b9
status: experimental
description: |
    Detects when a new credential (password/secret or certificate) is added to an existing service principal (enterprise application) in Microsoft Entra ID.
    Adversaries who have compromised a privileged account may add their own credentials to a service principal to establish stealthy, long-term persistence that survives user password resets, since service principal credentials authenticate the application itself rather than a user.
    Note: This complements azure_app_credential_added.yml (cbb67ecc-fb70-4467-9350-c910bdf7c628), which matches on "Update application - Certificates and secrets management" and "Update Service principal/Update Application". Neither of those covers the distinct "Add service principal credentials" activity, which is logged when a credential is added directly to the service principal object.
references:
    - https://learn.microsoft.com/en-us/entra/architecture/security-operations-applications#application-credentials
    - https://attack.mitre.org/techniques/T1098/001/
    - https://learn.microsoft.com/en-us/entra/identity/monitoring-health/reference-audit-activities
    - https://www.elastic.co/guide/en/security/current/prebuilt-rule-8-19-20-entra-id-service-principal-credentials-created-by-unusual-user.html
    - https://dirkjanm.io/azure-ad-privilege-escalation-application-admin/
author: Kartik Tripathi '@lmaotrip'
date: 2026-07-10
tags:
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1098.001
logsource:
    product: azure
    service: auditlogs
detection:
    selection:
        properties.message: 'Add service principal credentials'
    condition: selection
falsepositives:
    - Credentials legitimately rotated or added to a service principal by an administrator or an automated deployment/CI-CD process as part of normal operations.
level: high
