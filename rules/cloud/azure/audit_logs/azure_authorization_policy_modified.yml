title: Azure Tenant Authorization Policy Modified
id: f7d0cf11-75f5-4984-8e04-1a2735913fb1
status: experimental
description: |
    Detects changes to the Entra ID tenant authorization policy, the tenant-wide
    switchboard for what ordinary users can do by default: register applications,
    create security groups or tenants, invite guests, and which permission grant
    policies apply to the default user role. An attacker who controls a single
    ordinary account can widen one of these settings to create a persistence or
    privilege path, for example allowing users to register applications to hold
    credentials, or widening the permission grant policies so users can consent to
    applications on their own.
    Confirmed against a real event generated on a live tenant on 2026-10-26:
    toggling 'allowedToCreateApps' produces this exact operation name, with
    'DefaultUserRolePermissions.AllowedToCreateApps' in modifiedProperties showing
    the old and new value.
    This rule fires on every change and is noisy by design: it is a tenant-wide
    policy that legitimate administrators also touch. Pair it with Azure-Sentinel's
    TenantAuthorizationPolicyChanged.yaml, which narrows the same activity to
    specific sensitive settings and labels first-recorded snapshots separately from
    real changes.
references:
    - https://learn.microsoft.com/en-us/entra/identity/monitoring-health/reference-audit-activities#core-directory
    - https://learn.microsoft.com/en-us/graph/api/resources/authorizationpolicy
    - https://github.com/Azure/Azure-Sentinel/blob/master/Hunting%20Queries/AuditLogs/TenantAuthorizationPolicyChanged.yaml
author: descambiado
date: 2026-10-26
tags:
    - attack.persistence
    - attack.privilege-escalation
    - attack.credential-access
    - attack.t1098
logsource:
    product: azure
    service: auditlogs
detection:
    selection:
        operationName: 'Update authorization policy'
    condition: selection
falsepositives:
    - Legitimate tenant administration changing default user permissions
    - Planned rollout of a new permission grant policy
level: medium
