title: User Password Reset Or Change
id: 340ee172-4b67-4fb4-832f-f961bdc1f3aa
status: test
description: Detects when a user's password is reset or changed in Azure AD, either by the user via self-service or by an administrator.
references:
    - https://learn.microsoft.com/en-us/entra/architecture/security-operations-privileged-accounts
    - https://learn.microsoft.com/en-us/entra/identity/monitoring-health/reference-audit-activities
author: YochanaHenderson, '@Yochana-H'
date: 2022-08-03
modified: 2026-10-14
tags:
    - attack.privilege-escalation
    - attack.initial-access
    - attack.persistence
    - attack.credential-access
    - attack.stealth
    - attack.t1078.004
logsource:
    product: azure
    service: auditlogs
detection:
    selection:
        category: 'UserManagement'
        properties.result: 'success'
        operationName:
            - 'Change password (self-service)'
            - 'Reset password (self-service)'
            - 'Reset password (by admin)'
    condition: selection
falsepositives:
    - If this was approved by System Administrator or confirmed user action.
level: medium
