title: Account Lockout With Correct Password
id: df29607e-02dc-46c8-b4f9-734a6f7d9566
related:
    - id: 2b7d6fc0-71ac-4cf7-8ed1-b5788ee5257a # Account Lockout
      type: derived
status: experimental
description: |
    Detects account lockout events (sign-in error code 50053) where the authentication details show that the correct password was supplied.
    Error code 50053 is returned for two reasons: the account is locked after repeated failed attempts, or the sign-in was blocked because it came from an IP address flagged for malicious activity.
    When the password step result is "Correct password" on such an event, valid credentials were used but the sign-in was still blocked.
    This is a strong indicator that an attacker holds the account password and was stopped only by the lockout or IP-reputation control.
    Consider raising the severity to high for privileged or VIP accounts.
references:
    - https://learn.microsoft.com/en-us/entra/identity-platform/reference-error-codes
    - https://wizardcyber.com/detect-successful-brute-force-signins-entra-id-sentinel-xdr/
author: Semih Cirik (Easi)
date: 2026-11-22
tags:
    - attack.credential-access
    - attack.t1110
logsource:
    product: azure
    service: signinlogs
detection:
    selection:
        ResultType: 50053
        AuthenticationDetails|contains: 'Correct password'
    filter_main_incorrect_password:
        # "Incorrect password" also contains the substring "Correct password" (case-insensitive)
        AuthenticationDetails|contains: 'Incorrect password'
    condition: selection and not 1 of filter_main_*
falsepositives:
    - A legitimate user who triggered error code 50053 with several wrong passwords and then entered the correct password while the account was still locked.
level: medium
