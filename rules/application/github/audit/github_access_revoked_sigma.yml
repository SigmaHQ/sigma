title: GitHub - Access Revoked
id: 41d85d1a-4b4d-4be5-8e6d-4c80aca0d025
status: experimental
description: Detects GitHub revocation actions including revocation of tokens, SSO sessions, OAuth application tokens and others.
references:
    - https://docs.github.com/en/organizations/keeping-your-organization-secure/managing-security-settings-for-your-organization/audit-log-events-for-your-organization
    - https://docs.github.com/en/enterprise-cloud@latest/admin/monitoring-activity-in-your-enterprise/reviewing-audit-logs-for-your-enterprise/audit-log-events-for-your-enterprise
    - https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/security-log-events
author: Stamatis Chatzimangou (@_st0pp3r)
date: 2026-07-06
tags:
    - attack.impact
    - attack.t1531
logsource:
    product: github
    service: audit
    definition: 'Requirements: The audit log streaming feature must be enabled to be able to receive such logs. You can enable following the documentation here: https://docs.github.com/en/enterprise-cloud@latest/admin/monitoring-activity-in-your-enterprise/reviewing-audit-logs-for-your-enterprise/streaming-the-audit-log-for-your-enterprise#setting-up-audit-log-streaming'
detection:
    selection_integration:
        action:
            - 'integration.revoke_all_tokens'
            - 'integration.revoke_tokens'
    selection_oauth:
        action:
            - 'oauth_access.revoke'
            - 'oauth_application.revoke_all_tokens'
            - 'oauth_application.revoke_tokens'
    selection_token:
        action:
            - 'personal_access_token.credential_revoked'
            - 'org_credential_authorization.revoke'
    selection_sso:
        action:
            - 'business.revoke_sso_session'
            - 'org.revoke_sso_session'
    selection_role:
        action:
            - 'organization_role.revoke'
            - 'enterprise_role.revoke'
    selection_codespaces:
        action:
            - 'org.codespaces_team_access_revoked'
            - 'org.codespaces_trusted_repo_access_revoked'
            - 'org.codespaces_user_access_revoked'
            - 'user.codespaces_trusted_repo_access_revoked'
    condition: 1 of selection_*
falsepositives:
    - Authorised security responses revoking compromised tokens or sessions.
    - Off-boarding processes removing accesses for users.
level: medium
