title: GitHub - Organization Block/Unblock User
id: 7bd52440-5659-43ac-8734-24ee2bb1fa78
status: experimental
description: Detects when a user is blocked or unblocked from a GitHub organization. Unauthorized changes to organization user access may indicate an attempt to disrupt legitimate user activity or manipulate access controls.
references:
    - https://docs.github.com/en/organizations/keeping-your-organization-secure/managing-security-settings-for-your-organization/audit-log-events-for-your-organization
    - https://docs.github.com/en/communities/maintaining-your-safety-on-github/blocking-a-user-from-your-organization
author: Stamatis Chatzimangou (@_st0pp3r_)
date: 2026-08-17
tags:
    - attack.impact
    - attack.t1531
logsource:
    product: github
    service: audit
    definition: 'Requirements: The audit log streaming feature must be enabled to be able to receive such logs. You can enable it by following the documentation here: https://docs.github.com/en/enterprise-cloud@latest/admin/monitoring-activity-in-your-enterprise/reviewing-audit-logs-for-your-enterprise/streaming-the-audit-log-for-your-enterprise#setting-up-audit-log-streaming'
detection:
    selection:
        action:
            - 'org.block_user'
            - 'org.unblock_user'
    condition: selection
falsepositives:
    - Authorized administrators blocking or unblocking users.
    - Planned administrative actions during employee onboarding, offboarding, or access reviews.
level: medium
