title: DECTRAX Active Directory Decoy Kerberoasting & SPN Discovery
id: 9d5b2c43-a284-4e82-8235-84f00a85c303
status: test
description: Detects LDAP enumeration queries or Kerberos TGS-REQ ticket requests targeting DECTRAX Active Directory decoy Service Principal Names (SPN).
references:
    - https://dectrax.com/docs/active-directory-deception
author: Oscar Martinez (DECTRAX Security Engineering)
date: 2026-10-20
modified: 2026-10-21
tags:
    - attack.credential_access
    - attack.t1558.003
    - attack.discovery
    - attack.t1069.002
logsource:
    category: security
    product: dectrax
detection:
    selection:
        platform: 'DECTRAX'
        protocol:
            - 'LDAP'
            - 'ldap'
            - 'Kerberos'
            - 'kerberos'
        signature|contains:
            - 'Kerberoast'
            - 'SPN_Probe'
            - 'TGS-REQ'
            - 'DecoyAccountAccess'
    condition: selection
falsepositives:
    - None. Decoy SPNs are synthetic and not bound to production applications or services.
level: high
