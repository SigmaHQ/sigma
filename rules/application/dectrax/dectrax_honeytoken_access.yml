title: DECTRAX Honeytoken Credential Access
id: 8c4a1b32-9173-4f91-b124-73e99f74b202
status: test
description: Detects authentication attempts or credential access using a DECTRAX synthetic canary credential, AWS decoy key, fake database connection string, or fake Kerberos ticket.
references:
    - https://dectrax.com/docs/honeytokens
author: Oscar Martinez (DECTRAX Security Engineering)
date: 2026-10-20
modified: 2026-10-21
tags:
    - attack.credential_access
    - attack.t1078
    - attack.t1552
    - attack.t1558
logsource:
    category: application
    product: dectrax
detection:
    selection:
        platform: 'DECTRAX'
        category: 'HONEYTOKEN'
        action:
            - 'TRIGGER'
            - 'ACCESS'
    condition: selection
falsepositives:
    - None. Decoy credentials are not assigned to real users and should never be queried or used in authentication flows.
level: critical
