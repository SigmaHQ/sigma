title: DECTRAX Deception Sensor Interaction
id: 6a3f9e21-0819-4a92-bf31-64d88e63a101
status: test
description: Detects unauthorized interactive connection, credential brute-forcing, or exploitation attempts against a DECTRAX active deception honeypot sensor (SSH, RDP, Telnet, HTTP).
references:
    - https://dectrax.com/docs/detection
author: Oscar Martinez (DECTRAX Security Engineering)
date: 2026-10-20
modified: 2026-10-21
tags:
    - attack.initial_access
    - attack.lateral_movement
    - attack.t1190
    - attack.t1078
    - attack.t1021.001
    - attack.t1021.004
logsource:
    category: deception
    product: dectrax
detection:
    selection:
        platform: 'DECTRAX'
        event_type:
            - 'DECEPTION_TRIGGER'
            - 'HONEYPOT_INTERACTION'
            - 'THREAT_INTERCEPT'
        severity|gte: 7
    condition: selection
falsepositives:
    - Highly unlikely. DECTRAX decoy sensors carry no legitimate production workload.
level: high
