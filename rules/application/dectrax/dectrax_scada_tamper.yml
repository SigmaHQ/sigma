title: DECTRAX Industrial Control Protocol (SCADA/ICS) Tampering
id: 2f7d4e65-c406-4084-a457-06b22c07e505
status: experimental
description: Detects unauthorized connection or register modification attempts against DECTRAX OT/SCADA decoys (Modbus FC06/FC16, BACnet, S7comm, DNP3, MQTT).
references:
    - https://dectrax.com/docs/ot-deception
author: Oscar Martinez (DECTRAX Security Engineering)
date: 2026-10-20
modified: 2026-10-26
tags:
    - attack.initial-access
    - attack.t1190
    - attack.impact
    - attack.t1499
logsource:
    category: application
    product: dectrax
detection:
    selection:
        platform: 'DECTRAX'
        protocol:
            - 'modbus'
            - 'bacnet'
            - 's7comm'
            - 'dnp3'
            - 'mqtt'
    condition: selection
falsepositives:
    - None. Decoy industrial controllers are isolated from actual physical plant operations.
level: critical
