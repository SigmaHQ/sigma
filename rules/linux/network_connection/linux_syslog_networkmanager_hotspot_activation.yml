title: Potential Hotspot Activation via NetworkManager
id: 9b741eb3-8f1d-4f8e-8e28-4377d8e537c4
status: experimental
description: Detects when a user enables a WiFi hotspot on Ubuntu using NetworkManager, based on syslog entries.
references:
    - https://blog.checkpoint.com/security/rogue-wifi-hotspots-getting-coffee-putting-enterprise-risk-social-engineering-ep-4
author: 'Rahul Pandey'
date: 2025-04-07
modified: 2026-09-20
tags:
    - attack.collection
    - attack.credential-access
    - attack.t1557
logsource:
    product: linux
    definition: 'Need NetworkManager log'
detection:
    selection:
        message|contains|all:
            - 'connection-activate'
            - 'name="Hotspot"'
            - 'result="success"'
    condition: selection
falsepositives:
    - 'Users intentionally using hotspot for legitimate reasons'
    - 'Admins testing hotspot configurations'
level: medium
