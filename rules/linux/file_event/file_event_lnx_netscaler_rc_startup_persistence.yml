title: NetScaler Startup Script Modification for Persistence
id: 53a4c14b-d127-4a72-94a8-9b82d69e1e0e
related:
    - id: 652eda7b-cd81-46b0-87a4-13b02ed4ece0
      type: similar
status: experimental
description: |
    Detects write or append operations to /flash/nsconfig/rc.netscaler, the NetScaler
    appliance startup script executed on every boot. Following exploitation of any
    vulnerability such as CVE-2026-88772/88771 yielding code execution on a NetScaler
    appliance, threat actors havebeen observed establishing boot persistence by
    appending reverse shell stagers or backdoor commands to this file.
references:
    - https://sh3llc0d3.com/blog/inside-the-netscaler-zero-day-siege-chained-pre-auth-rces-weaponized-in-the-wild-watchtowr-disclosure/
    - https://github.com/NCSC-NL/citrix-2025/blob/a1b0b5f011a0332dbcee9cc834c66b8f181a34f0/live-host-bash-check/TLPCLEAR_check_script_cve-2025-6543-v1.8.sh
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2026-09-28
tags:
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1037.004
    - cve.2026-88771
    - cve.2026-88772
    - cve.2026-19490
logsource:
    category: file_event
    product: linux
detection:
    selection_path:
        TargetFilename|endswith: '/flash/nsconfig/rc.netscaler'
    selection_susp_image:
        Image|endswith:
            # these common shell interpreters are commented out to reduce false positives but it should be uncommented if needed and baselined
            # - '/bash'
            # - '/dash'
            - '/python'
            - '/python3'
            - '/perl'
            - '/curl'
            - '/wget'
            - '/tee'
    selection_susp_location:
        Image|startswith:
            - '/tmp/'
            - '/var/tmp/'
            - '/dev/shm/'
    condition: selection_path and 1 of selection_susp_*
falsepositives:
    - Unknown
level: high
