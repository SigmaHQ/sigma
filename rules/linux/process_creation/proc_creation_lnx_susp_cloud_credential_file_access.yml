title: Potential AWS or Google Cloud Credential File Access Via Linux Utility
id: 9f4eb0e0-50f9-40a3-bd25-bcfb0c258e4f
status: experimental
description: |
    Detects common Linux utilities such as cat, cp, tar or curl being run on the AWS shared credentials file or on the Google Cloud credential stores in a home directory.
    Attackers who land on a host often take these files first, because a valid key lets them reach the cloud account without coming back to the host.
    Admins, backup jobs and deployment scripts read the same files, so some hits will be harmless.
references:
    - https://www.securityweek.com/crypto-mining-worm-targets-aws-credentials/
    - https://jpassing.com/2020/01/14/google-application-default-credentials-vs-your-personal-gcloud-credentials/
author: Martin Chancalay
date: 2026-11-02
tags:
    - attack.credential-access
    - attack.t1552.001
logsource:
    category: process_creation
    product: linux
detection:
    selection_img:
        Image|endswith:
            - '/base64'
            - '/cat'
            - '/cp'
            - '/curl'
            - '/grep'
            - '/head'
            - '/less'
            - '/more'
            - '/rsync'
            - '/scp'
            - '/tail'
            - '/tar'
            - '/zip'
    selection_path:
        CommandLine|contains:
            - '/.aws/credentials'
            - '/.config/gcloud/application_default_credentials.json'
            - '/.config/gcloud/credentials.db'
            - '/.config/gcloud/legacy_credentials/'
    condition: all of selection_*
falsepositives:
    - Administrators or users checking or backing up their own cloud credentials
    - Backup and sync jobs that copy home directories
    - Configuration management or deployment scripts that read the credentials file
level: low
