title: Potential Command Execution Via Tcpdump Postrotate Command
id: 8eba4cc7-4ffc-4e5b-9e2f-6b9ef43cf225
status: experimental
description: |
    Detects execution of "tcpdump" with the "-z" (postrotate) option pointing to a shell, a script located in a temporary directory, or combined with "-Z root".
    The "-z" option runs the specified command after every rotated capture file. When "tcpdump" is executed with elevated privileges (e.g. via "sudo"), this is abused to execute arbitrary commands as root, a well-known Linux privilege-escalation primitive.
references:
    - https://gtfobins.github.io/gtfobins/tcpdump/
    - https://www.elastic.co/guide/en/security/current/linux-restricted-shell-breakout-via-linux-binary-s.html
author: Defa Mulya Pratama
date: 2026-10-07
tags:
    - attack.execution
    - attack.t1059
logsource:
    product: linux
    category: process_creation
detection:
    selection_bin:
        Image|endswith: '/tcpdump'
    selection_postrotate:
        CommandLine|contains: ' -z '
    selection_susp:
        CommandLine|contains:
            - '/tmp/'
            - '/dev/shm/'
            - '/var/tmp/'
            - '/bin/sh'
            - '/bin/bash'
            - ' -Z root'
    condition: all of selection_*
falsepositives:
    - Legitimate use of the "-z" option to run a compression utility (e.g. "gzip") on rotated capture files will generally not match, as it lacks the suspicious indicators required by this rule.
level: high
