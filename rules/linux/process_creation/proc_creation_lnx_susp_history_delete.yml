title: Shell Command History Tampering
id: 1182f3b3-e716-4efa-99ab-d2685d04360f
related:
    - id: fdc88d25-96fb-4b7c-9633-c0e417fdbd4e
      type: derived
status: test
description: |
    Detects commands that try to clear or tamper with the Linux command history.
    This technique is used by threat actors in order to evade defenses and execute commands
    without them being recorded in files such as "bash_history" or "zsh_history".
references:
    - https://github.com/sleventyeleven/linuxprivchecker/
    - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1070.003/T1070.003.md
    - https://www.hackers-arise.com/post/2016/06/20/covering-your-bash-shell-tracks-antiforensics
    - https://www.cadosecurity.com/spinning-yarn-a-new-linux-malware-campaign-targets-docker-apache-hadoop-redis-and-confluence/
author: Florian Roth (Nextron Systems), Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2022-06-20
modified: 2026-08-21
tags:
    - attack.stealth
    - attack.t1070.003
logsource:
    category: process_creation
    product: linux
detection:
    selection_img_delete:
        # e.g. rm ~/.bash_history
        # e.g. shred ~/.zsh_history
        Image|endswith:
            - '/rm'
            - '/unlink'
            - '/shred'
    selection_img_truncate:
        # e.g. truncate -s0 ~/.bash_history
        # e.g. truncate --size=0 ~/.zsh_history
        Image|endswith: '/truncate'
        CommandLine|re: '(-s|--size[=\s])\s{0,8}0'
    selection_img_ln:
        # e.g. ln -sf /dev/null ~/.bash_history
        # e.g. ln -sf /dev/zero ~/.zsh_history
        Image|endswith: '/ln'
        CommandLine|contains:
            - ' /dev/null '
            - ' /dev/zero'
    selection_img_chattr:
        # e.g. chattr +i ~/.bash_history
        Image|endswith: '/chattr'
        CommandLine|contains: ' +i'
    selection_cli_history_file:
        CommandLine|contains:
            - 'sh_history'
            - '.history'
            - 'zhistory'
    selection_shell:
        # e.g. bash -c "history -c"
        # e.g. zsh -c "HISTFILE=/dev/null some_command"
        # e.g. bash -c "export HISTFILESIZE=0; evil_cmd"
        # e.g. sh -c "shopt -ou history"
        Image|endswith:
            - '/ash'
            - '/bash'
            - '/busybox'
            - '/csh'
            - '/dash'
            - '/fish'
            - '/ksh'
            - '/sh'
            - '/tcsh'
            - '/zsh'
        CommandLine|contains:
            - '"" >*sh_history' # echo and printf commands
            - '> ~/.*sh_history'
            - 'HISTFILE=/dev/null'
            - 'HISTFILESIZE=0'
            - 'history -c'
            - 'history -w'
            - 'HISTSIZE=0'
            - 'shopt -ou history'
            - 'shopt -uo history'
    condition: (1 of selection_img_* and selection_cli_history_file) or selection_shell
falsepositives:
    - Legitimate administration activities
level: high
