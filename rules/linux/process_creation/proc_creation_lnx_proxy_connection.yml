title: Connection Proxy
id: 72f4ab3f-787d-495d-a55d-68c2ff46cf4c
status: test
description: Detects processes that set proxy environment variables, which may indicate command-and-control traffic tunneled through an external proxy.
references:
    - https://everything.curl.dev/usingcurl/proxies/env.html
    - https://curl.se/libcurl/c/libcurl-env.html
author: Ömer Günal
date: 2020-06-17
modified: 2026-10-21
tags:
    - attack.command-and-control
    - attack.t1090
logsource:
    product: linux
    category: process_creation
detection:
    selection:
        CommandLine|contains:
            - 'http_proxy='
            - 'https_proxy='
            - 'ftp_proxy='
            - 'all_proxy='
    condition: selection
falsepositives:
    - Legitimate administration activities
level: low
