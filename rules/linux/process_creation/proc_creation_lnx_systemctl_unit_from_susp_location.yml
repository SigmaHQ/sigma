title: Systemd Unit Linked Or Enabled From Suspicious Location
id: 9d457f96-1479-4777-807b-0e8b4953c959
status: experimental
description: |
    Detects "systemctl link" or "systemctl enable" referencing a unit file located in a world-writable directory such as "/tmp", "/var/tmp" or "/dev/shm".
    Linking a unit file from an arbitrary path registers it with systemd without writing it to the regular unit directories, which evades file-based monitoring of those directories.
    Adversaries abuse this to execute payloads as a systemd service and to establish persistence.
references:
    - https://www.freedesktop.org/software/systemd/man/latest/systemctl.html
    - https://gtfobins.github.io/gtfobins/systemctl/
    - https://www.elastic.co/security-labs/primer-on-persistence-mechanisms
    - https://github.com/redcanaryco/atomic-red-team/blob/388942adbd9641f4dfdcf079d7efe9a75ec0ac43/atomics/T1569.003/T1569.003.md
author: elhoim
date: 2026-10-01
tags:
    - attack.execution
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1569.003
    - attack.t1543.002
logsource:
    product: linux
    category: process_creation
detection:
    selection_img:
        Image|endswith: '/systemctl'
    selection_action:
        CommandLine|contains:
            - ' enable '
            - ' link '
    selection_path:
        CommandLine|contains:
            - '/dev/shm/'
            - '/tmp/'
            - '/var/tmp/'
    condition: all of selection_*
falsepositives:
    - Developers testing unit files from temporary directories
level: high
simulation:
    - type: atomic-red-team
      name: Create systemd Service Unit from /tmp (Unusual Location)
      technique: T1569.003
      atomic_guid: a1fa406e-2354-4a24-b6d6-94157e7564d4
    - type: atomic-red-team
      name: Create systemd Service Unit from /dev/shm (Unusual Location)
      technique: T1569.003
      atomic_guid: dce49381-a26b-4d95-bdfa-c607ffe8bee5
