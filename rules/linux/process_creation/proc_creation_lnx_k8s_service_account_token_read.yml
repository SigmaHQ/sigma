title: Kubernetes Service Account Token Access Via CLI
id: a25659cb-9db7-433a-b4eb-6258c962f72d
status: experimental
description: |
    Detects a command line referencing the Kubernetes service account token or credentials mounted into pods under "/var/run/secrets/kubernetes.io/serviceaccount/", either from inside a container or via "kubectl exec".
    Adversaries who gain code execution inside a pod read the service account token to authenticate to the Kubernetes API server and escalate privileges or move laterally within the cluster.
references:
    - https://kubernetes.io/docs/tasks/run-application/access-api-from-pod/
    - https://unit42.paloaltonetworks.com/hildegard-malware-teamtnt/
    - https://github.com/redcanaryco/atomic-red-team/blob/388942adbd9641f4dfdcf079d7efe9a75ec0ac43/atomics/T1552.007/T1552.007.md
author: elhoim
date: 2026-10-01
tags:
    - attack.credential-access
    - attack.t1552.007
logsource:
    product: linux
    category: process_creation
detection:
    selection:
        CommandLine|contains: '/secrets/kubernetes.io/serviceaccount/'
    condition: selection
falsepositives:
    - Init containers or scripts in pods legitimately reading the service account token to call the Kubernetes API
level: medium
simulation:
    - type: atomic-red-team
      name: Cat the contents of a Kubernetes service account token file
      technique: T1552.007
      atomic_guid: 788e0019-a483-45da-bcfe-96353d46820f
