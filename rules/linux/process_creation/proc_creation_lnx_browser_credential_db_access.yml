title: Browser Profile Credential Or History Database Access Via CLI - Linux
id: 096c302e-5e7b-4771-b5e5-12c8d690a96d
status: experimental
description: |
    Detects command line utilities searching for, reading, copying or archiving browser profile databases that hold saved credentials, cookies or browsing history, such as Firefox "logins.json", "key4.db", "cookies.sqlite" and "places.sqlite" or Chromium "Login Data", "Cookies" and "Bookmarks".
    Infostealers and post-exploitation scripts collect these files to decrypt saved passwords and session cookies offline or to learn about internal resources.
references:
    - https://github.com/AlessandroZ/LaZagne
    - https://support.mozilla.org/en-US/kb/profiles-where-firefox-stores-user-data
    - https://github.com/redcanaryco/atomic-red-team/blob/388942adbd9641f4dfdcf079d7efe9a75ec0ac43/atomics/T1217/T1217.md
    - https://github.com/redcanaryco/atomic-red-team/blob/388942adbd9641f4dfdcf079d7efe9a75ec0ac43/atomics/T1555.003/T1555.003.md
author: elhoim
date: 2026-10-01
tags:
    - attack.credential-access
    - attack.discovery
    - attack.t1555.003
    - attack.t1217
logsource:
    product: linux
    category: process_creation
detection:
    selection_img:
        Image|endswith:
            - '/base64'
            - '/cat'
            - '/cp'
            - '/find'
            - '/locate'
            - '/plocate'
            - '/rsync'
            - '/scp'
            - '/sqlite3'
            - '/strings'
            - '/tar'
            - '/zip'
    selection_firefox:
        CommandLine|contains:
            - 'cookies.sqlite'
            - 'key3.db'
            - 'key4.db'
            - 'logins.json'
            - 'places.sqlite'
    selection_chromium_profile:
        CommandLine|contains:
            - '/.config/BraveSoftware/'
            - '/.config/chromium/'
            - '/.config/google-chrome'
            - '/.config/microsoft-edge'
            - '/.config/opera'
            - '/.config/vivaldi'
    selection_chromium_file:
        CommandLine|contains:
            - '/Bookmarks'
            - '/Cookies'
            - '/Login Data'
            - '/Web Data'
    condition: selection_img and (selection_firefox or all of selection_chromium_*)
falsepositives:
    - Backup jobs copying user home directories
    - Users or forensic tooling inspecting their own browser profile
level: medium
simulation:
    - type: atomic-red-team
      name: List Mozilla Firefox Bookmark Database Files on FreeBSD/Linux
      technique: T1217
      atomic_guid: 3a41f169-a5ab-407f-9269-abafdb5da6c2
    - type: atomic-red-team
      name: List Google Chromium Bookmark JSON Files on FreeBSD
      technique: T1217
      atomic_guid: 88ca025b-3040-44eb-9168-bd8af22b82fa
