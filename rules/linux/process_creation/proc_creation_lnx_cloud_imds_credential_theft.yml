title: Cloud Instance Metadata API Query for Credential Theft
id: a1b3839d-705c-48b2-9d95-b773944bcdd9
status: experimental
description: |
    Detects curl and wget querying a cloud instance metadata service for an
    endpoint that returns temporary credentials or tokens for the role or managed
    identity attached to the instance. Covers the AWS EC2 and ECS credential
    endpoints, the Azure managed identity token, and the GCP service account token.

    Adversaries with code execution on a cloud workload query these link-local
    endpoints to steal those credentials and move into the cloud control plane.
    The rule matches only credential-bearing paths, so benign metadata lookups
    such as instance-id, region or user-data do not fire.

    Scope is limited to curl and wget on purpose. Scripting-language clients such
    as python, perl or nc are not covered here, since matching those images
    reliably would need parent-process context the process_creation logsource does
    not provide.
references:
    - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1552.005/T1552.005.md
    - https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/instance-metadata-security-credentials.html
    - https://docs.aws.amazon.com/AmazonECS/latest/developerguide/task-iam-roles.html
    - https://learn.microsoft.com/en-us/entra/identity/managed-identities-azure-resources/how-to-use-vm-token
    - https://cloud.google.com/compute/docs/access/authenticate-workloads
author: Gideon Opukeme
date: 2026-10-18
tags:
    - attack.credential-access
    - attack.t1552
    - attack.t1552.005
logsource:
    category: process_creation
    product: linux
detection:
    selection_img:
        Image|endswith:
            - '/curl'
            - '/wget'
    selection_host:
        CommandLine|contains:
            - '169.254.169.254'
            - '169.254.170.2'
            - 'metadata.google.internal'
    selection_credential_path:
        CommandLine|contains:
            - '/meta-data/iam/security-credentials'
            - '/v2/credentials'
            - '/metadata/identity/oauth2/token'
            - '/computeMetadata/v1/instance/service-accounts'
    filter_optional_cloud_agents:
        ParentImage|endswith:
            - '/amazon-ssm-agent'
            - '/ssm-agent-worker'
            - '/google_guest_agent'
            - '/google_metadata_script_runner'
            - '/cloud-init'
    condition: selection_img and selection_host and selection_credential_path and not 1 of filter_optional_*
falsepositives:
    - Cloud bootstrap or monitoring agents that read instance role credentials, filtered by parent process where the agent is known
    - Administrators troubleshooting instance roles or managed identities
level: medium
