title: Cloud Instance Metadata API Query for Credential Theft
id: a1b3839d-705c-48b2-9d95-b773944bcdd9
status: experimental
description: |
    Detects command line tools querying a cloud instance metadata service for
    credentials. Adversaries with code execution on a cloud workload query these
    link-local endpoints to retrieve the role or managed identity credentials
    attached to the instance, then use them to move into the cloud control plane.
references:
    - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1552.005/T1552.005.md
    - https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/instance-metadata-security-credentials.html
    - https://learn.microsoft.com/en-us/entra/identity/managed-identities-azure-resources/how-to-use-vm-token
    - https://cloud.google.com/compute/docs/access/authenticate-workloads
author: Gideon Opukeme
date: 2026-10-18
tags:
    - attack.credential-access
    - attack.t1552
    - attack.t1552.005
logsource:
    category: process_creation
    product: linux
detection:
    selection_img:
        Image|endswith:
            - '/curl'
            - '/wget'
    selection_imds:
        CommandLine|contains:
            - '169.254.169.254'
            - '169.254.170.2'
            - 'metadata.google.internal'
    filter_optional_cloud_agents:
        ParentImage|endswith:
            - '/amazon-ssm-agent'
            - '/ssm-agent-worker'
            - '/google_guest_agent'
            - '/google_metadata_script_runner'
    condition: selection_img and selection_imds and not 1 of filter_optional_*
falsepositives:
    - Cloud-init and monitoring agents bootstrapping on the instance, filtered by parent process where known
    - Administrators troubleshooting instance role or managed identity credentials
level: medium
