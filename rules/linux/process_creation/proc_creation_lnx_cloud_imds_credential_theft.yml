title: Cloud Instance Metadata API Query for Credential Theft
id: a1b3839d-705c-48b2-9d95-b773944bcdd9
status: experimental
description: |
    Detects queries to the cloud instance metadata service (169.254.169.254) using
    curl or wget. Adversaries query this endpoint from compromised cloud instances
    to retrieve credentials and other secrets such as IAM role credentials.
references:
    - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1552.005/T1552.005.md
author: Gideon Opukeme
date: 2026-10-18
tags:
    - attack.credential-access
    - attack.t1552
    - attack.t1552.005
logsource:
    category: process_creation
    product: linux
detection:
    selection_img:
        Image|endswith:
            - '/curl'
            - '/wget'
    selection_imds:
        CommandLine|contains: '169.254.169.254'
    condition: selection_img and selection_imds
falsepositives:
    - Cloud-init and legitimate monitoring agents that query instance metadata for configuration
    - On-premises tooling that happens to reference the link-local address
level: high
