title: Cloud Instance Metadata Credential Or Token Request Via CLI - Linux
id: 31f87cbb-010c-4dbc-8495-0b9f01a638de
status: experimental
description: |
    Detects a command line querying a cloud instance metadata service (IMDS) endpoint that returns temporary credentials or access tokens of the role or managed identity attached to the instance.
    Covers AWS EC2 IAM role credentials, the AWS ECS container credentials endpoint, Azure managed identity tokens, GCP service account tokens and Alibaba Cloud RAM role credentials.
    Adversaries with code execution on a cloud workload, or abusing an SSRF, query these endpoints to steal credentials and pivot into the cloud control plane.
references:
    - https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/instance-metadata-security-credentials.html
    - https://learn.microsoft.com/en-us/entra/identity/managed-identities-azure-resources/how-to-use-vm-token
    - https://cloud.google.com/compute/docs/access/authenticate-workloads
    - https://hackingthe.cloud/aws/exploitation/ec2-metadata-ssrf/
    - https://github.com/redcanaryco/atomic-red-team/blob/388942adbd9641f4dfdcf079d7efe9a75ec0ac43/atomics/T1552.005/T1552.005.md
author: elhoim
date: 2026-10-01
tags:
    - attack.credential-access
    - attack.t1552.005
logsource:
    product: linux
    category: process_creation
detection:
    selection_host:
        CommandLine|contains:
            - '100.100.100.200' # Alibaba Cloud
            - '169.254.169.254'
            - '169.254.170.2' # AWS ECS task credentials
            - 'fd00:ec2::254'
            - 'metadata.google.internal'
    selection_path:
        CommandLine|contains:
            - '/computeMetadata/v1/instance/service-accounts'
            - '/meta-data/iam/security-credentials'
            - '/meta-data/ram/security-credentials'
            - '/metadata/identity/oauth2/token'
            - '/v2/credentials'
    filter_optional_cloud_agents:
        ParentImage|endswith:
            - '/amazon-ssm-agent'
            - '/cloud-init'
            - '/google_guest_agent'
            - '/google_metadata_script_runner'
            - '/ssm-agent-worker'
            - '/waagent'
    condition: all of selection_* and not 1 of filter_optional_*
falsepositives:
    - Cloud bootstrap or configuration management scripts that read instance role credentials
    - Administrators troubleshooting instance roles or managed identities
level: medium
simulation:
    - type: atomic-red-team
      name: AWS - Retrieve EC2 IAM Role Credentials via IMDSv2
      technique: T1552.005
      atomic_guid: c9aa1ca4-04df-4623-adac-1f199ca5ce42
