title: Audit Subsystem Disable Attempt via Auditctl
id: b5d3f2a1-9e4c-4b7d-a8c6-3e2f1d0b5a9c
status: experimental
description: |
    Detects the use of auditctl trying to disable the Linux audit subsystem or flush all active audit rules.
    Unlike killing auditd outright, this leaves the daemon running while silently stopping event collection,
    making it a stealthier defense evasion technique. Commonly used by ransomware and attackers before
    encryption or exfiltration to eliminate forensic evidence.
references:
    - https://tlpblack.net/blog/20260728-a-deep-dive-into-bytetobreach-s-bytetocrypt-ransomware
    - https://man7.org/linux/man-pages/man8/auditctl.8.html
    - https://www.virustotal.com/gui/file/14ed580291658fa6410f4cbb18d9a2f979b93f4ce640c7445d999bcf440492e8/behavior
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2026-08-19
tags:
    - attack.defense-impairment
    - attack.t1685.004
logsource:
    category: process_creation
    product: linux
detection:
    selection_img:
        Image|endswith: '/auditctl'
    selection_cli:
        - CommandLine|contains|all: # auditctl -e 0 --> disables the audit subsystem
            - ' -e'
            - '0'
        - CommandLine|contains|cased: ' -D' # flush all active audit rules
    condition: all of selection_*
falsepositives:
    - Unlikely
level: high
