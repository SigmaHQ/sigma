title: Nsenter Escape to Host Namespace
id: b48ed9ae-609f-4c0f-a1ac-c687aa1ee11b
status: experimental
description: |
    Detects the use of nsenter to enter the host process and mount namespaces from
    within a container. This is a common container escape technique used to break
    out of a container and execute commands on the underlying host.
references:
    - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1611/T1611.md
    - https://man7.org/linux/man-pages/man1/nsenter.1.html
    - https://www.elastic.co/guide/en/security/current/potential-docker-escape-via-nsenter.html
author: Gideon Opukeme
date: 2026-10-18
tags:
    - attack.privilege-escalation
    - attack.t1611
logsource:
    category: process_creation
    product: linux
detection:
    selection_img:
        Image|endswith: '/nsenter'
    selection_target_mid:
        CommandLine|contains:
            - ' -t 1 '
            - ' -t1 '
            - ' --target 1 '
            - ' --target=1 '
    selection_target_end:
        CommandLine|endswith:
            - ' -t 1'
            - ' -t1'
            - ' --target 1'
            - ' --target=1'
    selection_ns_path:
        CommandLine|contains: '=/proc/1/ns/'
    condition: selection_img and (1 of selection_target_* or selection_ns_path)
falsepositives:
    - Administrators using nsenter to debug or manage containers from the host
    - Node debugging tooling such as kubectl node-shell or similar privileged debug pods
level: high
