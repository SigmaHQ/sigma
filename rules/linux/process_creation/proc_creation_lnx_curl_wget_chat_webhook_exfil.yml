title: Data Sent To Chat Service Webhook Via Curl Or Wget - Linux
id: 4a85061d-6e64-4488-906e-13914e8c24aa
status: experimental
description: |
    Detects "curl" or "wget" sending data or uploading a file to a chat or collaboration service webhook or bot API, such as Discord or Slack webhooks, the Telegram Bot API or Microsoft Teams incoming webhooks.
    Infostealers, malicious packages and post-exploitation scripts abuse these webhooks as an easy exfiltration and notification channel that blends in with legitimate traffic.
references:
    - https://discord.com/developers/docs/resources/webhook
    - https://api.slack.com/messaging/webhooks
    - https://core.telegram.org/bots/api#senddocument
    - https://github.com/redcanaryco/atomic-red-team/blob/388942adbd9641f4dfdcf079d7efe9a75ec0ac43/atomics/T1567.004/T1567.004.md
author: elhoim
date: 2026-10-01
tags:
    - attack.exfiltration
    - attack.t1567.004
logsource:
    product: linux
    category: process_creation
detection:
    selection_img:
        Image|endswith:
            - '/curl'
            - '/wget'
    selection_webhook:
        CommandLine|contains:
            - 'api.telegram.org/bot'
            - 'discord.com/api/webhooks/'
            - 'discordapp.com/api/webhooks/'
            - 'hooks.slack.com/'
            - '.webhook.office.com/'
    selection_data_flags:
        - CommandLine|contains:
              - ' --data'
              - ' --form'
              - ' --upload-file'
              - ' --post-data'
              - ' --post-file'
              - ' --body-data'
              - ' --body-file'
              - ' -X POST'
              - ' --request POST'
        - CommandLine|re: '\s-[FTd]\s'
    condition: all of selection_*
falsepositives:
    - Monitoring, alerting or CI scripts posting notifications to chat webhooks
level: medium
simulation:
    - type: atomic-red-team
      name: Exfiltrate staged file to a Discord webhook with curl (bash)
      technique: T1567.004
      atomic_guid: 40c44d16-bb49-4d14-aafa-f9ba7e6e6c5b
    - type: atomic-red-team
      name: Exfiltrate staged data to a Slack webhook with curl (sh)
      technique: T1567.004
      atomic_guid: c666acd6-6ff5-4d28-9490-195d89cd4337
