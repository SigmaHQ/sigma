title: Suspicious Child Process Spawned by Citrix NetScaler Daemon
id: c0f678c1-7d9d-4276-ac25-d270e88b22d2
status: experimental
description: |
    Detects a suspicious child process spawned by a Citrix NetScaler daemon on NetScaler
    appliances. When vulnerabilities such as CVE-2026-19490 are exploited, attackers
    typically obtain code execution through one of the exposed daemons. The first
    observable artefact is a shell, interpreter, or network utility forked from that
    daemon - usually running as nobody or root. NetScaler daemons do not fork
    interactive or network processes under normal operation, making this a reliable
    indicator of active exploitation.
references:
    - https://sh3llc0d3.com/blog/inside-the-netscaler-zero-day-siege-chained-pre-auth-rces-weaponized-in-the-wild-watchtowr-disclosure/
    - https://github.com/murrez/CVE-2026-88772
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2026-09-28
tags:
    - attack.initial-access
    - attack.t1190
    - attack.execution
    - cve.2026-19490
    - cve.2026-88772
logsource:
    product: linux
    category: process_creation
detection:
    selection_parent_img:
        ParentImage|endswith:
            - '/nsppe' # Packet Processing Engine
            - '/nsnetsvc' # NetScaler Service Daemon
            - '/nsvpnd' # NetScaler VPN Daemon
            - '/nsaaad' # NetScaler AAA/Authentication Daemon
            - '/nsd' # Core NetScaler Daemon
    selection_susp_img:
        Image|endswith:
            - '/curl'
            - '/nc'
            - '/ncat'
            - '/perl'
            - '/python'
            - '/python3'
            - '/wget'
    selection_susp_cli:
        CommandLine|contains:
            - '/dev/tcp'
            - '/dev/udp'
            - '| bash'
            - '| sh'
            - 'base64 -d'
            - 'cron'
            - 'curl'
            - 'nc '
            - 'ncat'
            - 'netcat'
            - 'ns.conf'
            - 'perl'
            - 'python'
            - 'socat'
            - 'socket'
            - 'subprocess'
            - 'wget'
    condition: selection_parent_img and 1 of selection_susp_*
falsepositives:
    - Unknown
level: high
