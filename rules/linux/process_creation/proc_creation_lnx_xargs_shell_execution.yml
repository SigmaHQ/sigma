title: Potential Shell Or Command Execution Via Xargs
id: b9d97509-9e2f-4086-810a-f289b78aec3b
status: experimental
description: |
    Detects the use of "xargs" with the "-a /dev/null" (or "--arg-file=/dev/null") option to execute a command with no input.
    This is a GTFOBins technique used to spawn a shell or run arbitrary commands, and when "xargs" is executed with elevated privileges (e.g. via sudo) it is abused for privilege escalation or to break out of restricted environments.
references:
    - https://gtfobins.github.io/gtfobins/xargs/
    - https://www.elastic.co/guide/en/security/current/linux-restricted-shell-breakout-via-linux-binary-s.html
author: Defa Mulya Pratama
date: 2026-10-07
tags:
    - attack.execution
    - attack.t1059
logsource:
    product: linux
    category: process_creation
detection:
    selection:
        Image|endswith: '/xargs'
        CommandLine|contains:
            - '-a /dev/null'
            - '--arg-file=/dev/null'
            - '--arg-file /dev/null'
    condition: selection
falsepositives:
    - Unlikely. Reading arguments from "/dev/null" provides no input and is rarely used in legitimate automation.
level: high
