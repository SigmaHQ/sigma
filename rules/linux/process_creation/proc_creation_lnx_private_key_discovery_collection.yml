title: Private Key Material Discovery Or Collection Via CLI - Linux
id: 98576949-8bd9-4d9b-8555-b0e55571b0e3
status: experimental
description: |
    Detects command line utilities searching for, copying or archiving private key material such as SSH private keys, GnuPG keyrings, WireGuard configurations or TLS private key files.
    Also detects dumping the private key of a WireGuard interface via "wg showconf" or "wg show <interface> private-key".
    Adversaries collect private keys to authenticate to other systems, decrypt data or impersonate services.
references:
    - https://www.man7.org/linux/man-pages/man8/wg.8.html
    - https://github.com/redcanaryco/atomic-red-team/blob/388942adbd9641f4dfdcf079d7efe9a75ec0ac43/atomics/T1552.004/T1552.004.md
author: elhoim
date: 2026-10-01
tags:
    - attack.credential-access
    - attack.t1552.004
logsource:
    product: linux
    category: process_creation
detection:
    selection_tools_img:
        Image|endswith:
            - '/base64'
            - '/cat'
            - '/cp'
            - '/find'
            - '/locate'
            - '/plocate'
            - '/rsync'
            - '/scp'
            - '/tar'
            - '/zip'
    selection_tools_cli:
        CommandLine|contains:
            - '.gnupg'
            - '/etc/wireguard'
            - 'id_dsa'
            - 'id_ecdsa'
            - 'id_ed25519'
            - 'id_rsa'
    selection_find_img:
        Image|endswith:
            - '/find'
            - '/locate'
            - '/plocate'
    selection_find_cli:
        CommandLine|contains:
            - '.key'
            - '.p12'
            - '.pem'
            - '.pfx'
            - '.ppk'
    selection_wg_img:
        Image|endswith: '/wg'
    selection_wg_cli:
        CommandLine|contains:
            - ' private-key'
            - ' showconf'
    filter_main_public_key:
        CommandLine|endswith: '.pub'
    condition: (all of selection_tools_* or all of selection_find_* or all of selection_wg_*) and not 1 of filter_main_*
falsepositives:
    - Backup jobs or configuration management copying user home directories or key material
    - Administrators locating or saving WireGuard configurations (e.g. "wg-quick save")
level: medium
