title: Process Hiding Via Bind Mount Over Proc PID Directory
id: 8ba8ed39-4418-4e0a-93d2-4c8af0cc8181
status: experimental
description: |
    Detects a bind mount whose target is a numeric "/proc/<pid>" directory.
    Mounting another directory (for example an empty folder or the "/proc" entry of a kernel thread) over "/proc/<pid>" hides the real process from tools such as "ps", "top" or "lsof", which read process information from procfs.
    This technique is used by Linux malware and rootkit-like tooling to conceal running processes.
references:
    - https://righteousit.com/2024/07/24/hiding-linux-processes-with-bind-mounts/
    - https://github.com/redcanaryco/atomic-red-team/blob/388942adbd9641f4dfdcf079d7efe9a75ec0ac43/atomics/T1036.004/T1036.004.md
author: elhoim
date: 2026-10-01
tags:
    - attack.stealth
    - attack.t1564.013
    - attack.t1036.004
logsource:
    product: linux
    category: process_creation
detection:
    selection_img:
        Image|endswith: '/mount'
    selection_flags:
        CommandLine|contains:
            - ' -B '
            - ' -R '
            - 'bind'
    selection_target:
        CommandLine|re: '\s/proc/[0-9]+/?$'
    condition: all of selection_*
falsepositives:
    - Unlikely
level: high
simulation:
    - type: atomic-red-team
      name: Hiding a malicious process with bind mounts
      technique: T1036.004
      atomic_guid: ad4b73c2-d6e2-4d8b-9868-4c6f55906e01
