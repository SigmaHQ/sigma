title: Local System Accounts Discovery - Linux
id: b45e3d6f-42c6-47d8-a478-df6bd6cf534c
status: test
description: |
    Detects enumeration of local system accounts.
    This information can help adversaries determine which local accounts exist on a system to aid in follow-on behavior.
references:
    - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1087.001/T1087.001.md
    - https://my.f5.com/manage/s/article/K589
    - https://man.freebsd.org/cgi/man.cgi?pwd_mkdb
    - https://man7.org/linux/man-pages/man1/getent.1.html
    - https://linux.die.net/man/1/finger
author: Alejandro Ortuno, nasbench, oscd.community, CheraghiMilad
date: 2020-10-08
modified: 2026-07-03
tags:
    - attack.discovery
    - attack.t1087.001
logsource:
    category: process_creation
    product: linux
detection:
    selection_lastlog:
        Image|endswith:
            - '/lastlog'
            - '/last'
            - '/lastb'
    selection_root_string:
        CommandLine|contains: 'x:0:'
    selection_read_utilities:
        Image|endswith:
            - '/cat'
            - '/ed'
            - '/emacs'
            - '/head'
            - '/less'
            - '/makemap'
            - '/more'
            - '/nano'
            - '/sqlite3'
            - '/tail'
            - '/vi'
            - '/vim'
    selection_read_files:
        CommandLine|contains:
            - 'passwd'
            - 'shadow'
            - 'sudoers'
            - 'spwd.db'
            - 'pwd.db'
            - 'master.passwd'
    selection_id:
        Image|endswith: '/id'
    selection_lsof:
        Image|endswith: '/lsof'
        CommandLine|contains: '-u'
    selection_getent:
        Image|endswith: '/getent'
        CommandLine|contains:
            - ' passwd'
            - ' shadow'
    selection_who:
        Image|endswith:
            - '/finger'
            - '/users'
            - '/w'
            - '/who'
    selection_ypcat:
        Image|endswith: '/ypcat'
        CommandLine|contains: 'passwd'
    condition: selection_lastlog or selection_root_string or (selection_read_utilities and selection_read_files) or selection_id or selection_lsof or selection_getent or selection_who or selection_ypcat
falsepositives:
    - Legitimate administration activities
level: low
