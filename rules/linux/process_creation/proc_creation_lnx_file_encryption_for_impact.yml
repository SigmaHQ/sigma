title: Non-Interactive File Encryption Via CLI Utilities - Linux
id: 55c4c494-664a-490a-946e-35750d38f1d1
status: experimental
description: |
    Detects non-interactive file encryption using "gpg" symmetric encryption with a passphrase supplied on the command line or via a file descriptor, "ccencrypt" with a key supplied on the command line, or "openssl" public key encryption ("rsautl" / "pkeyutl" with "-encrypt").
    Adversaries and Linux ransomware scripts use these built-in utilities to encrypt data on a host to impact availability.
references:
    - https://www.gnupg.org/documentation/manuals/gnupg/GPG-Esoteric-Options.html
    - https://ccrypt.sourceforge.net/
    - https://www.openssl.org/docs/manmaster/man1/openssl-pkeyutl.html
    - https://github.com/redcanaryco/atomic-red-team/blob/388942adbd9641f4dfdcf079d7efe9a75ec0ac43/atomics/T1486/T1486.md
author: elhoim
date: 2026-10-01
tags:
    - attack.impact
    - attack.t1486
logsource:
    product: linux
    category: process_creation
detection:
    selection_gpg_img:
        Image|endswith:
            - '/gpg'
            - '/gpg2'
    selection_gpg_passphrase:
        CommandLine|contains: '--passphrase'
    selection_gpg_symmetric:
        CommandLine|contains:
            - ' -c '
            - ' --symmetric'
    selection_ccrypt_img:
        Image|endswith:
            - '/ccencrypt'
            - '/ccrypt'
    selection_ccrypt_cli:
        CommandLine|contains:
            - ' -K'
            - ' --key'
    selection_openssl_img:
        Image|endswith: '/openssl'
    selection_openssl_cmd:
        CommandLine|contains:
            - ' pkeyutl'
            - ' rsautl'
    selection_openssl_encrypt:
        CommandLine|contains: ' -encrypt'
    filter_optional_ccrypt_decrypt:
        Image|endswith: '/ccrypt'
        CommandLine|contains:
            - ' -d'
            - ' --decrypt'
    condition: (all of selection_gpg_* or all of selection_ccrypt_* or all of selection_openssl_*) and not 1 of filter_optional_*
falsepositives:
    - Backup software or scripts encrypting archives with a passphrase (e.g. duplicity)
    - Administrators encrypting files for transport
level: medium
simulation:
    - type: atomic-red-team
      name: Encrypt files using gpg (FreeBSD/Linux)
      technique: T1486
      atomic_guid: 7b8ce084-3922-4618-8d22-95f996173765
    - type: atomic-red-team
      name: Encrypt files using ccrypt (FreeBSD/Linux)
      technique: T1486
      atomic_guid: 08cbf59f-85da-4369-a5f4-049cffd7709f
    - type: atomic-red-team
      name: Encrypt files using openssl (FreeBSD/Linux)
      technique: T1486
      atomic_guid: 142752dc-ca71-443b-9359-cf6f497315f1
    - type: atomic-red-team
      name: Data Encrypted with zip and gpg symmetric
      technique: T1560.001
      atomic_guid: 0286eb44-e7ce-41a0-b109-3da516e05a5f
