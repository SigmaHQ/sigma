title: Suspicious Transient Systemd Timer Or Service Created Via Systemd-Run
id: ef2f07aa-52ae-41f5-a0af-9fb4856dac48
status: experimental
description: |
    Detects the creation of a transient systemd timer or service via "systemd-run" with a timer trigger or a suspicious payload such as a shell one-liner, a file located in a world-writable directory or a download utility.
    Transient units are not written to the regular unit directories and therefore evade file-based persistence monitoring.
    Adversaries abuse "systemd-run" to execute commands as a systemd service or to schedule recurring execution without touching crontab or unit files on disk.
references:
    - https://www.freedesktop.org/software/systemd/man/latest/systemd-run.html
    - https://gtfobins.github.io/gtfobins/systemd-run/
    - https://github.com/redcanaryco/atomic-red-team/blob/388942adbd9641f4dfdcf079d7efe9a75ec0ac43/atomics/T1053.006/T1053.006.md
    - https://github.com/redcanaryco/atomic-red-team/blob/388942adbd9641f4dfdcf079d7efe9a75ec0ac43/atomics/T1569.003/T1569.003.md
author: elhoim
date: 2026-10-01
tags:
    - attack.execution
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1053.006
    - attack.t1569.003
logsource:
    product: linux
    category: process_creation
detection:
    selection_img:
        Image|endswith: '/systemd-run'
    selection_cli_timer:
        CommandLine|contains:
            - '--on-active'
            - '--on-boot'
            - '--on-calendar'
            - '--on-clock-change'
            - '--on-startup'
            - '--on-timezone-change'
            - '--on-unit-active'
            - '--on-unit-inactive'
            - '--timer-property'
    selection_cli_payload:
        CommandLine|contains:
            - '/bin/bash -c'
            - '/bin/dash -c'
            - '/bin/sh -c'
            - '/bin/zsh -c'
            - ' bash -c '
            - ' sh -c '
            - '/dev/shm/'
            - '/tmp/'
            - '/var/tmp/'
            - 'base64'
            - 'curl '
            - 'wget '
    condition: selection_img and 1 of selection_cli_*
falsepositives:
    - Administrators or CI pipelines scheduling one-off jobs with systemd-run
    - Desktop environments and container tooling launching transient scopes or timers
level: medium
simulation:
    - type: atomic-red-team
      name: Create a user level transient systemd service and timer
      technique: T1053.006
      atomic_guid: 3de33f5b-62e5-4e63-a2a0-6fd8808c80ec
    - type: atomic-red-team
      name: Create a system level transient systemd service and timer
      technique: T1053.006
      atomic_guid: d3eda496-1fc0-49e9-aff5-3bec5da9fa22
    - type: atomic-red-team
      name: Execute Command via Transient systemd Service (systemd-run)
      technique: T1569.003
      atomic_guid: a73a886f-23c5-4e8f-b1ab-b1bbc1f5e236
