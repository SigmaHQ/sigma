title: System and Hardware Information Discovery
id: 1f358e2e-cb63-43c3-b575-dfb072a6814f
related:
    - id: 42df45e7-e6e9-43b5-8f26-bec5b39cc239
      type: derived
status: stable
description: Detects system information discovery commands
references:
    - https://www.picussecurity.com/resource/blog/t1082-system-information-discovery
    - https://df00tech.com/detections/T1082
    - https://threatpodium.com/detection-playbook-system-information-discovery-t1082/
author: Ömer Günal, oscd.community
date: 2020-10-08
modified: 2022-11-26
tags:
    - attack.discovery
    - attack.t1082
logsource:
    product: linux
    service: auditd
detection:
    selection:
        type: 'PATH'
        name:
            - '/sys/class/dmi/id/bios_version'
            - '/sys/class/dmi/id/product_name'
            - '/sys/class/dmi/id/chassis_vendor'
            - '/proc/scsi/scsi'
            - '/proc/ide/hd0/model'
            - '/proc/version'
            - '/etc/*version'
            - '/etc/*release'
            - '/etc/issue'
    condition: selection
falsepositives:
    - Legitimate administration activities
level: informational
simulation:
    - type: atomic-red-team
      name: Linux VM Check via Hardware
      technique: T1082
      atomic_guid: 31dad7ad-2286-4c02-ae92-274418c85fec
    - type: atomic-red-team
      name: List OS Information
      technique: T1082
      atomic_guid: cccb070c-df86-4216-a5bc-9fb60c74e27c
