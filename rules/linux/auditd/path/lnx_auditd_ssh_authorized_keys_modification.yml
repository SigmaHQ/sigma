title: SSH Authorized Keys File Modification
id: cb0b988d-c31f-45ef-8e67-0b7bce3b98d1
status: experimental
description: |
    Detects creation or modification of SSH authorized_keys files through the
    Linux audit subsystem. Adversaries append their own public key to a victim's
    authorized_keys file to regain access without a password (T1098.004).

    This rule uses auditd PATH records rather than a file-event logsource. On
    hosts running auditd but not Sysmon for Linux, a file-event rule never fires
    because nothing produces that telemetry, so this is the variant that covers
    the common server deployment. The audit record also retains the login UID
    across privilege escalation, which lets an analyst tell which user wrote the
    key even when they escalated to root to do it.
references:
    - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1098.004/T1098.004.md
    - https://man7.org/linux/man-pages/man5/sshd_config.5.html
    - https://man7.org/linux/man-pages/man8/auditd.8.html
author: Gideon Opukeme
date: 2026-10-17
tags:
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1098
    - attack.t1098.004
logsource:
    product: linux
    service: auditd
detection:
    selection_user_path:
        type: 'PATH'
        name|endswith:
            - '/.ssh/authorized_keys'
            - '/.ssh/authorized_keys2'
    selection_system_path:
        type: 'PATH'
        name|contains: '/etc/ssh/authorized_keys'
    condition: 1 of selection_*
falsepositives:
    - Legitimate administrators adding SSH keys during onboarding
    - Configuration management tools deploying keys as part of server provisioning
level: medium
