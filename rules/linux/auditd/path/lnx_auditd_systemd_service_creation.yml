title: Systemd Service Creation
id: 1bac86ba-41aa-4f62-9d6b-405eac99b485
status: test
description: Detects a creation of systemd services which could be used by adversaries to execute malicious code.
references:
    - https://evilcel3ri.github.io/2026/01/16/system-devil.html
    - https://pberba.github.io/security/2022/01/30/linux-threat-hunting-for-persistence-systemd-timers-cron/
    - https://www.elastic.co/security-labs/primer-on-persistence-mechanisms
author: 'Pawel Mazur'
date: 2022-02-03
modified: 2022-02-06
tags:
    - attack.privilege-escalation
    - attack.persistence
    - attack.t1543.002
logsource:
    product: linux
    service: auditd
detection:
    path:
        type: 'PATH'
        nametype: 'CREATE'
    name_1:
        name|startswith:
            - '/usr/lib/systemd/system/'
            - '/etc/systemd/system/'
    name_2:
        name|contains: '/.config/systemd/user/'
    condition: path and 1 of name_*
falsepositives:
    - Legitimate service installation by administrators.
level: medium
simulation:
    - type: atomic-red-team
      name: Create Systemd Service
      technique: T1543.002
      atomic_guid: d9e4f24f-aa67-4c6e-bcbf-85622b697a7c
    - type: atomic-red-team
      name: TeamPCP Aqua Trivy Persistence
      technique: T1543.002
      atomic_guid: a29738b0-0e14-488c-984f-6a851fcdbcfe
