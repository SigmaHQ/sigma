title: Modification of ld.so.preload
id: 4b3cb710-5e83-4715-8c45-8b2b5b3e5751
status: experimental
description: >
    Detects modification of /etc/ld.so.preload via auditd monitoring.
    The ld.so.preload file allows loading shared objects into every new
    process and is commonly abused by adversaries for privilege escalation,
    persistence, or rootkit deployment.
    This rule expects an auditd watch on the file, for example:
    -w /etc/ld.so.preload -p wa
references:
    - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1574.006/T1574.006.md
    - https://eqllib.readthedocs.io/en/latest/analytics/fd9b987a-1101-4ed3-bda6-a70300eaf57e.html
author: E.M. Anhaus (originally from Atomic Blue Detections, Tony Lambert), oscd.community, Aadith C H
date: 2019-10-24
modified: 2026-10-09
tags:
    - attack.privilege-escalation
    - attack.persistence
    - attack.execution
    - attack.stealth
    - attack.t1574.006
logsource:
    product: linux
    service: auditd
detection:
    selection:
        type: 'PATH'
        name: '/etc/ld.so.preload'
        nametype:
            - 'CREATE'
            - 'NORMAL'
    condition: selection
falsepositives:
    - Legitimate package installation (e.g., glibc updates)
    - Authorized system configuration or security tooling
level: high
