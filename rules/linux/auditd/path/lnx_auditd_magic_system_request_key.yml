title: Potential Abuse of Linux Magic System Request Key
id: ea61bb82-a5e0-42e6-8537-91d29500f1b9
status: experimental
description: |
    Detects the potential abuse of the Linux Magic SysRq (System Request) key by adversaries with root or sufficient privileges
    to silently manipulate or destabilize a system. By writing to /proc/sysrq-trigger, they can crash the system, kill processes,
    or disrupt forensic analysis—all while bypassing standard logging. Though intended for recovery and debugging, SysRq can be
    misused as a stealthy post-exploitation tool. It is controlled via /proc/sys/kernel/sysrq or permanently through /etc/sysctl.conf.
references:
    - https://www.kernel.org/doc/html/latest/admin-guide/sysrq.html
    - https://docs.redhat.com/en/documentation/red_hat_enterprise_linux/6/html/deployment_guide/s2-proc-sysrq-trigger
    - https://www.splunk.com/en_us/blog/security/threat-update-awfulshred-script-wiper.html
author: Milad Cheraghi
date: 2025-05-23
tags:
    - attack.execution
    - attack.t1059.004
    - attack.impact
    - attack.t1529
    - attack.t1489
    - attack.t1499
logsource:
    product: linux
    service: auditd
    definition: |
        Required auditd configuration:
        -w /proc/sysrq-trigger -p wa -k sysrq
        -w /proc/sys/kernel/sysrq -p wa -k sysrq
detection:
    selection:
        type: 'PATH'
        name|endswith:
            # Enable
            - '/sysrq'
            - '/sysctl.conf'
            # Execute
            - '/sysrq-trigger'
    condition: selection
falsepositives:
    - Legitimate administrative activity
level: medium
simulation:
    - type: atomic-red-team
      name: Abuse of linux magic system request key for Send a SIGTERM to all processes
      technique: T1489
      atomic_guid: 6e76f56f-2373-4a6c-a63f-98b7b72761f1
    - type: atomic-red-team
      name: Abuse of Linux Magic System Request Key for Reboot
      technique: T1529
      atomic_guid: d2a1f4bc-a064-4223-8281-a086dce5423c
    - type: atomic-red-team
      name: Reboot Linux Host via Kernel System Request
      technique: T1685
      atomic_guid: 6d6d3154-1a52-4d1a-9d51-92ab8148b32e
