title: Steganography Unzip Hidden Information From Picture File
id: edd595d7-7895-4fa7-acb3-85a18a8772ca
status: test
description: Detects the extraction of a zip file from an image file.
references:
    - https://www.howtogeek.com/270668/how-to-hide-a-file-or-folder-in-an-image-in-linux/
    - https://df00tech.com/detections/T1027.003
    - https://www.splunk.com/en_us/blog/security/image-steganography-quasar-rat-detection.html
author: 'Pawel Mazur'
date: 2021-09-09
modified: 2022-10-09
tags:
    - attack.stealth
    - attack.t1027.003
logsource:
    product: linux
    service: auditd
detection:
    commands:
        type: EXECVE
        a0: unzip
    a1:
        a1|endswith:
            - '.jpg'
            - '.png'
    condition: commands and a1
falsepositives:
    - Unknown
level: low
