title: Data Compressed
id: a3b5e3e9-1b49-4119-8b8e-0344a01f21ee
status: test
description: An adversary may compress data (e.g., sensitive documents) that is collected prior to exfiltration in order to make it portable and minimize the amount of data sent over the network.
references:
    - https://www.systemshardening.com/articles/observability/data-exfiltration-detection/
    - https://feed.craftedsignal.io/briefs/2024-01-02-sensitive-file-compression/
    - https://df00tech.com/detections/T1560.001
author: Timur Zinniatullin, oscd.community
date: 2019-10-21
modified: 2026-09-18
tags:
    - attack.exfiltration
    - attack.collection
    - attack.t1560.001
logsource:
    product: linux
    service: auditd
detection:
    selection1:
        type: 'execve'
        a0: 'zip'
    selection2:
        type: 'execve'
        a0: 'gzip'
        a1: '-k'
    selection3:
        type: 'execve'
        a0: 'tar'
        a1|contains: '-c'
    condition: 1 of selection*
falsepositives:
    - Legitimate use of archiving tools.
level: low
simulation:
    - type: atomic-red-team
      name: Data Compressed - nix - zip
      technique: T1560.001
      atomic_guid: c51cec55-28dd-4ad2-9461-1eacbc82c3a0
    - type: atomic-red-team
      name: Data Compressed - nix - gzip Single File
      technique: T1560.001
