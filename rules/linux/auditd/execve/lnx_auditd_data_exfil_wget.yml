title: Data Exfiltration with Wget
id: cb39d16b-b3b6-4a7a-8222-1cf24b686ffc
status: test
description: |
    Detects attempts to post the file using the wget utility.
    The adversary can bypass the permission restriction with a misconfigured sudo permission for wget which could allow them to read files like /etc/shadow.
references:
    - https://www.man7.org/linux/man-pages/man1/wget.1.html
    - https://gtfobins.github.io/gtfobins/wget/
author: 'Pawel Mazur'
date: 2021-11-18
modified: 2026-09-18
tags:
    - attack.exfiltration
    - attack.t1048.003
logsource:
    product: linux
    service: auditd
detection:
    selection:
        type: EXECVE
        a0: wget
        a1|startswith: '--post-file='
    condition: selection
falsepositives:
    - Legitimate usage of wget utility to post a file
level: medium
simulation:
    - type: atomic-red-team
      name: Exfiltrate data in a file over HTTPS using wget
      technique: T1048.002
      atomic_guid: 7ccdfcfa-6707-46bc-b812-007ab6ff951c
