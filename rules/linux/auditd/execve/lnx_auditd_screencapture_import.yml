title: Screen Capture with Import Tool
id: dbe4b9c5-c254-4258-9688-d6af0b7967fd
status: test
description: |
  Detects an adversary creating a screen capture of a desktop with Import Tool.
  Highly recommended on servers, due to high usage of screenshot utilities on user workstations.
  ImageMagick must be installed.
references:
    - https://imagemagick.org/script/import.php
    - https://imagemagick.org/
author: 'Pawel Mazur'
date: 2021-09-21
modified: 2022-10-09
tags:
    - attack.collection
    - attack.t1113
logsource:
    product: linux
    service: auditd
detection:
    import:
        type: EXECVE
        a0: import
    import_window_root:
        a1: '-window'
        a2: 'root'
        a3|endswith:
            - '.png'
            - '.jpg'
            - '.jpeg'
    import_no_window_root:
        a1|endswith:
            - '.png'
            - '.jpg'
            - '.jpeg'
    condition: import and (import_window_root or import_no_window_root)
falsepositives:
    - Legitimate use of screenshot utility
level: low
simulation:
    - type: atomic-red-team
      name: Capture Linux Desktop using Import Tool
      technique: T1113
      atomic_guid: 9cd1cccb-91e4-4550-9139-e20a586fcea1
