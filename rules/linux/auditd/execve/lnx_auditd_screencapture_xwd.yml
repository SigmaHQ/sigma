title: Screen Capture with Xwd
id: e2f17c5d-b02a-442b-9052-6eb89c9fec9c
status: test
description: Detects an adversary creating a screen capture of the full screen with xwd. Highly recommended on servers, due to high usage of screenshot utilities on user workstations.
references:
    - https://manpages.debian.org/bookworm/x11-apps/xwd.1.en.html
    - https://df00tech.com/detections/T1113
    - https://www.securityscientist.net/blog/12-questions-and-answers-about-screen-capture-t1113/
author: 'Pawel Mazur'
date: 2021-09-13
modified: 2022-12-18
tags:
    - attack.collection
    - attack.t1113
logsource:
    product: linux
    service: auditd
detection:
    selection:
        type: EXECVE
        a0: xwd
    xwd_root_window:
        a1: '-root'
        a2: '-out'
        a3|endswith: '.xwd'
    xwd_no_root_window:
        a1: '-out'
        a2|endswith: '.xwd'
    condition: selection and 1 of xwd_*
falsepositives:
    - Legitimate use of screenshot utility
level: low
simulation:
    - type: atomic-red-team
      name: X Windows Capture
      technique: T1113
      atomic_guid: 8206dd0c-faf6-4d74-ba13-7fbe13dce6ac
