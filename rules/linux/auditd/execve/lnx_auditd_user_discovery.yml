title: System Owner or User Discovery - Linux
id: 9a0d8ca0-2385-4020-b6c6-cb6153ca56f3
status: test
description: |
    Detects the execution of host or user discovery utilities such as "whoami", "hostname", "id", etc.
    Adversaries may use the information from System Owner/User Discovery during automated discovery to shape follow-on behaviors, including whether or not the adversary fully infects the target and/or attempts specific actions.
references:
    - https://research.splunk.com/endpoint/d1ff2e22-310d-446a-80b3-faedaa7b3b52/
    - https://df00tech.com/detections/T1033
    - https://www.securityscientist.net/blog/12-questions-and-answers-about-system-owner-user-discovery-t1033/
author: Timur Zinniatullin, oscd.community
date: 2019-10-21
modified: 2025-06-04
tags:
    - attack.discovery
    - attack.t1033
logsource:
    product: linux
    service: auditd
detection:
    selection:
        type: 'EXECVE'
        a0:
            - 'hostname'
            - 'id'
            - 'last'
            - 'uname'
            - 'users'
            - 'w'
            - 'who'
            - 'whoami'
    condition: selection
falsepositives:
    - Admin activity
level: low
simulation:
    - type: atomic-red-team
      name: System Owner/User Discovery
      technique: T1033
      atomic_guid: 2a9b677d-a230-44f4-ad86-782df1ef108c
    - type: atomic-red-team
      name: Hostname Discovery
      technique: T1082
      atomic_guid: 486e88ea-4f56-470f-9b57-3f4d73f39133
    - type: atomic-red-team
      name: List OS Information
      technique: T1082
      atomic_guid: cccb070c-df86-4216-a5bc-9fb60c74e27c
