title: Service Reload or Start - Linux
id: 2625cc59-0634-40d0-821e-cb67382a3dd7
status: test
description: Detects the start, reload or restart of a service.
references:
    - https://pberba.github.io/security/2022/01/30/linux-threat-hunting-for-persistence-systemd-timers-cron/
    - https://evilcel3ri.github.io/2026/01/16/system-devil.html
    - https://linuxsecurity.com/features/linux-persistence-hunting-techniques
author: Jakob Weinzettl, oscd.community, CheraghiMilad
date: 2019-09-23
modified: 2025-03-03
tags:
    - attack.privilege-escalation
    - attack.persistence
    - attack.t1543.002
logsource:
    product: linux
    service: auditd
detection:
    selection:
        type: 'EXECVE'
        a0|contains:
            - 'systemctl'
            - 'service'
        a1|contains:
            - 'reload'
            - 'start'
    condition: selection
falsepositives:
    - Installation of legitimate service.
    - Legitimate reconfiguration of service.
    - Command line contains daemon-reload.
level: low
simulation:
    - type: atomic-red-team
      name: Create Systemd Service
      technique: T1543.002
      atomic_guid: d9e4f24f-aa67-4c6e-bcbf-85622b697a7c
    - type: atomic-red-team
      name: Create Systemd Service file,  Enable the service , Modify and Reload the service.
      technique: T1543.002
      atomic_guid: c35ac4a8-19de-43af-b9f8-755da7e89c89
