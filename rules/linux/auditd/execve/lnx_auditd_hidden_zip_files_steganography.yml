title: Steganography Hide Zip Information in Picture File
id: 45810b50-7edc-42ca-813b-bdac02fb946b
status: test
description: Detects the appending of a zip file to an image.
references:
    - https://www.howtogeek.com/270668/how-to-hide-a-file-or-folder-in-an-image-in-linux/
    - https://df00tech.com/detections/T1027.003
    - https://www.splunk.com/en_us/blog/security/image-steganography-quasar-rat-detection.html
author: 'Pawel Mazur'
date: 2021-09-09
modified: 2026-09-18
tags:
    - attack.stealth
    - attack.t1027.003
logsource:
    product: linux
    service: auditd
detection:
    commands:
        type: EXECVE
        a0: cat
    a1:
        a1|endswith:
            - '.jpg'
            - '.png'
    a2:
        a2|endswith: '.zip'
    condition: commands and a1 and a2
falsepositives:
    - Unknown
level: low
