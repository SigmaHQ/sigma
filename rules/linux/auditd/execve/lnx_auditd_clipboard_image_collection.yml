title: Clipboard Collection of Image Data with Xclip Tool
id: f200dc3f-b219-425d-a17e-c38467364816
status: test
description: |
  Detects attempts to collect image data stored in the clipboard from users using the xclip tool.
  Xclip must be installed.
  Highly recommended on servers, due to high usage of clipboard utilities on user workstations.
references:
    - https://manpages.debian.org/bookworm/xclip/xclip.1.en.html
    - https://research.splunk.com/endpoint/9ddfe470-c4d0-4e60-8668-7337bd699edd/
    - https://www.elastic.co/docs/reference/security/prebuilt-rules/rules/linux/collection_linux_clipboard_activity
author: 'Pawel Mazur'
date: 2021-10-01
modified: 2026-09-18
tags:
    - attack.collection
    - attack.t1115
logsource:
    product: linux
    service: auditd
detection:
    selection:
        type: EXECVE
        a0: xclip
        a1:
            - '-selection'
            - '-sel'
        a2:
            - clipboard
            - clip
        a3: '-t'
        a4|startswith: 'image/'
        a5: '-o'
    condition: selection
falsepositives:
    - Legitimate usage of xclip tools
level: low
