title: Hidden Files and Directories
id: d08722cd-3d09-449a-80b4-83ea2d9d4616
status: test
description: Detects an adversary creating hidden files or directories, i.e. files or directories starting with a dot.
references:
    - https://www.xpert4cyber.com/2026/07/mkdir-command-hide-malware-linux.html
    - https://df00tech.com/detections/T1564.001
    - https://www.elastic.co/blog/unmasking-concealed-artifacts-elastic-stack
author: 'Pawel Mazur'
date: 2021-09-06
modified: 2025-06-16
tags:
    - attack.stealth
    - attack.t1564.001
logsource:
    product: linux
    service: auditd
detection:
    selection_commands:
        type: 'EXECVE'
        a0:
            - 'mkdir'
            - 'nano'
            - 'touch'
            - 'vi'
            - 'vim'
    selection_arguments:
        - a1|re: '(^|\/)\.[^.\/]'
        - a2|re: '(^|\/)\.[^.\/]'
    condition: all of selection_*
falsepositives:
    - Unknown
level: low
simulation:
    - type: atomic-red-team
      name: Create a hidden file in a hidden directory
      technique: T1564.001
      atomic_guid: 61a782e5-9a19-40b5-8ba4-69a4b9f3d7be
