title: Disable System Firewall
id: 53059bc0-1472-438b-956a-7508a94a91f0
status: test
description: Detects disabling of system firewalls which could be used by adversaries to bypass controls that limit usage of the network.
references:
    - https://firewalld.org/documentation/man-pages/firewall-cmd.html
    - https://research.splunk.com/endpoint/07052556-d4b5-4bae-89aa-cbdc1bb11250/
    - https://www.picussecurity.com/resource/blog/t1562-004-disable-or-modify-system-firewall
author: 'Pawel Mazur'
date: 2022-01-22
tags:
    - attack.defense-impairment
    - attack.t1686
logsource:
    product: linux
    service: auditd
detection:
    selection:
        type: 'SERVICE_STOP'
        unit:
            - 'firewalld'
            - 'iptables'
            - 'ufw'
    condition: selection
falsepositives:
    - Admin activity
level: high
simulation:
    - type: atomic-red-team
      name: Stop/Start UFW firewall systemctl
      technique: T1686
      atomic_guid: 9fd99609-1854-4f3c-b47b-97d9a5972bd1
