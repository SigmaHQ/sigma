title: System Information Discovery - Auditd
id: f34047d9-20d3-4e8b-8672-0a35cc50dc71
status: test
description: Detects System Information Discovery commands
references:
    - https://threatpodium.com/detection-playbook-system-information-discovery-t1082/
author: Pawel Mazur
date: 2021-09-03
modified: 2023-03-06
tags:
    - attack.discovery
    - attack.t1082
logsource:
    product: linux
    service: auditd
detection:
    selection_1:
        type: PATH
        name:
            - /etc/lsb-release
            - /etc/redhat-release
            - /etc/issue
    selection_2:
        type: EXECVE
        a0:
            - uname
            - uptime
            - lsmod
            - hostname
            - env
    selection_3:
        type: EXECVE
        a0: grep
        a1|contains:
            - vbox
            - vm
            - xen
            - virtio
            - hv
    selection_4:
        type: EXECVE
        a0: kmod
        a1: list
    condition: 1 of selection_*
falsepositives:
    - Likely
level: low
simulation:
    - type: atomic-red-team
      name: List OS Information
      technique: T1082
      atomic_guid: cccb070c-df86-4216-a5bc-9fb60c74e27c
    - type: atomic-red-team
      name: Linux VM Check via Kernel Modules
      technique: T1082
      atomic_guid: 8057d484-0fae-49a4-8302-4812c4f1e64e
    - type: atomic-red-team
      name: Hostname Discovery
      technique: T1082
      atomic_guid: 486e88ea-4f56-470f-9b57-3f4d73f39133
    - type: atomic-red-team
      name: Environment variables discovery on freebsd, macos and linux
      technique: T1082
      atomic_guid: fcbdd43f-f4ad-42d5-98f3-0218097e2720
    - type: atomic-red-team
      name: Linux List Kernel Modules
      technique: T1082
      atomic_guid: 034fe21c-3186-49dd-8d5d-128b35f181c7
