title: Password Policy Discovery - Linux
id: ca94a6db-8106-4737-9ed2-3e3bb826af0a
status: stable
description: Detects password policy discovery commands
references:
    - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1201/T1201.md
    - https://linux.die.net/man/1/chage
    - https://man7.org/linux/man-pages/man1/passwd.1.html
    - https://superuser.com/questions/150675/how-to-display-password-policy-information-for-a-user-ubuntu
author: Ömer Günal, oscd.community, Pawel Mazur
date: 2020-10-08
modified: 2024-12-01
tags:
    - attack.discovery
    - attack.t1201
logsource:
    product: linux
    service: auditd
detection:
    selection_files:
        type: 'PATH'
        name:
            - '/etc/login.defs'
            - '/etc/pam.d/auth'
            - '/etc/pam.d/common-account'
            - '/etc/pam.d/common-auth'
            - '/etc/pam.d/common-password'
            - '/etc/pam.d/system-auth'
            - '/etc/security/pwquality.conf'
    selection_chage:
        type: 'EXECVE'
        a0: 'chage'
        a1:
            - '--list'
            - '-l'
    selection_passwd:
        type: 'EXECVE'
        a0: 'passwd'
        a1:
            - '-S'
            - '--status'
    condition: 1 of selection_*
falsepositives:
    - Legitimate administration activities
level: low
simulation:
    - type: atomic-red-team
      name: Examine password complexity policy - Ubuntu
      technique: T1201
      atomic_guid: 085fe567-ac84-47c7-ac4c-2688ce28265b
    - type: atomic-red-team
      name: Examine password complexity policy - CentOS/RHEL 7.x
      technique: T1201
      atomic_guid: 78a12e65-efff-4617-bc01-88f17d71315d
    - type: atomic-red-team
      name: Examine password complexity policy - CentOS/RHEL 6.x
      technique: T1201
      atomic_guid: 6ce12552-0adb-4f56-89ff-95ce268f6358
    - type: atomic-red-team
      name: Examine password expiration policy - All Linux
      technique: T1201
      atomic_guid: 7c86c55c-70fa-4a05-83c9-3aa19b145d1a
