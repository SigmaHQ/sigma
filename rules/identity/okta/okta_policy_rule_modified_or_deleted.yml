title: Okta Policy Rule Modified or Deleted
id: 0c97c1d3-4057-45c9-b148-1de94b631931
status: test
description: Detects when a policy rule is modified, deactivated or deleted.
references:
    - https://developer.okta.com/docs/reference/api/system-log/
    - https://developer.okta.com/docs/reference/api/event-types/
author: Austin Songer @austinsonger, Sanjit Pawar (Update)
date: 2021-09-12
modified: 2026-10-22
tags:
    - attack.impact
logsource:
    product: okta
    service: okta
detection:
    selection:
        eventType:
            - policy.rule.update
            - policy.rule.delete
            - policy.rule.deactivate
    condition: selection
falsepositives:
    - Unknown

level: medium
