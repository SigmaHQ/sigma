title: SafeLine WAF Blocked SQL Injection Attempt
id: 282d6588-75bb-4d49-aab0-0dac849ac382
status: experimental
description: |
    Detects SQL injection attempts blocked by the Chaitin SafeLine WAF.
    SafeLine emits syslog (RFC5424, msgid safeline_event) with a JSON payload
    where attack_type is the English snake_case label "sql_injection" and
    rule_id carries the firing module (e.g. m_sqli). This rule matches only
    deny verdicts so monitoring-mode deployments do not alert.
    Verified against live SafeLine 9.4.1 syslog output.
references:
    - https://github.com/chaitin/SafeLine
    - https://owasp.org/www-community/attacks/SQL_Injection
author: DevCop95
date: 2026-09-23
tags:
    - attack.initial-access
    - attack.t1190
logsource:
    product: safeline
    category: webserver
detection:
    selection:
        attack_type: 'sql_injection'
        action: 'deny'
    condition: selection
falsepositives:
    - Authorized penetration tests and vulnerability scanners exercising login/search forms
    - Web vulnerability monitors (e.g. uptime services probing with synthetic payloads)
    - Benign parameters containing SQL keywords (e.g. a search for "select" in documentation sites)
level: high
