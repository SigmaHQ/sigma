title: SafeLine WAF High Rate Of Blocked Attacks From Single Source
id: 3d3e76fb-3857-4908-9d3f-1f2ef129bd36
status: experimental
description: |
    Detects more than 10 attacks blocked by the Chaitin SafeLine WAF from the
    same source IP within 10 minutes. One blocked probe is routine WAF
    operation; a burst of denies in a short window can indicate a targeted
    campaign that the SOC should investigate. Tune the threshold to the site's
    baseline.
    Verified field semantics against live SafeLine 9.4.1 syslog output.
references:
    - https://github.com/chaitin/SafeLine
author: DevCop95
date: 2026-09-23
tags:
    - attack.initial-access
    - attack.t1190
correlation:
    type: event_count
    rules:
        - safeline_blocked_attack
    group-by:
        - src_ip
    timespan: 10m
    condition:
        gt: 10
falsepositives:
    - Authorized penetration tests and red team exercises running directory or payload fuzzing
    - Egress NAT or forward proxies concentrating many users (and attackers) behind one IP
    - Misbehaving integrations retrying blocked requests in a tight loop
level: high
