title: SafeLine WAF Blocked Cross Site Scripting Attempt
id: bf17c75f-96b2-4c67-83b2-421e2c1680ba
status: experimental
description: |
    Detects cross site scripting payloads blocked by the Chaitin SafeLine WAF.
    SafeLine emits syslog (RFC5424, msgid safeline_event) with a JSON payload
    where attack_type is the English snake_case label "xss" and rule_id carries
    the firing module (e.g. m_xss). The location field records where the payload
    was found (urlpath, query, header, body, cookie); producers should keep it
    for triage. This rule matches only deny verdicts so monitoring-mode
    deployments do not alert.
    Verified against live SafeLine 9.4.1 syslog output.
references:
    - https://github.com/chaitin/SafeLine
    - https://owasp.org/www-community/attacks/xss/
author: DevCop95
date: 2026-09-23
tags:
    - attack.initial-access
    - attack.t1190
logsource:
    product: safeline
    category: webserver
detection:
    selection:
        attack_type: 'xss'
        action: 'deny'
    condition: selection
falsepositives:
    - Authorized penetration tests and client-side security scanners
    - Applications that legitimately reflect markup in preview fields (WAF-side tuning required, hence the cookie-location exclusion is only a starting point)
    - Security awareness training platforms submitting inert payloads
level: medium
