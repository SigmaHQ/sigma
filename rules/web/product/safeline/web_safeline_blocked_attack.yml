title: SafeLine WAF Blocked Attack
id: 66b3e910-4f54-4d6b-88d3-c9650ab1b8fc
name: safeline_blocked_attack
status: experimental
description: |
    Detects an attack blocked by the Chaitin SafeLine WAF. SafeLine emits
    syslog (RFC5424, msgid safeline_event) with a JSON payload and an action
    field set to deny for blocked events. A burst of denied requests from one
    source is detected by the accompanying correlation rule.
    Verified field semantics against live SafeLine 9.4.1 syslog output.
references:
    - https://github.com/chaitin/SafeLine
author: DevCop95
date: 2026-09-23
tags:
    - attack.initial-access
    - attack.t1190
logsource:
    product: safeline
    category: webserver
detection:
    selection:
        action: 'deny'
    condition: selection
