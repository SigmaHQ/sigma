title: Authentication Method Registered From Outside Corporate Network
id: 4a1e6f92-3c8d-4b7a-9e5f-2d61c8a94b30
status: experimental
description: |
    Detects registration of a new authentication method (Authenticator app, phone
    number, FIDO2 key) on a user account from an IP address outside known corporate
    ranges. This is commonly observed after AiTM phishing kits such as Tycoon2FA
    hijack a session token: the attacker registers a new MFA method to preserve
    persistent access even after the victim resets their password.
references:
    - https://blog.sekoia.io/tycoon2fa-an-in-depth-analysis-of-the-innovative-phishing-kit/
author: Enrique Rodríguez Romero
date: 2026-09-07
tags:
    - attack.persistence
    - attack.t1556.006
logsource:
    product: azure
    service: auditlogs
detection:
    selection:
        Category: 'UserManagement'
        ActivityDisplayName:
            - 'Add auth method'
            - 'User registered security info'
            - 'Update user'
    filter_corp_ip:
        IPAddress|cidr|expand: '%corporate_ip_ranges%'
    condition: selection and not filter_corp_ip
falsepositives:
    - Employees registering a new MFA device while traveling or working from home
      outside documented corporate IP ranges
    - Requires the placeholder '%corporate_ip_ranges%' to be defined with the
      organization's own trusted CIDR ranges via a pySigma pipeline config
level: medium
