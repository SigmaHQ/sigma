title: Web Static Asset Hotlinked From Non-Owned Origin
id: 9c4e2a71-3f6b-4d8e-b1a5-7e2c0d9f6a34
status: experimental
description: |
    Detects static web assets (images, stylesheets, scripts, icons) requested with a Referer header from an origin the organization does not own.
    Cloned pages, often login portals used for credential phishing, frequently keep loading assets from the legitimate site, which leaks the clone's location through the Referer.
    A localhost or private IP Referer suggests a phishing kit under development, while a lookalike domain suggests a live campaign.
    Replace the '%owned_web_origins%' placeholder with every origin the organization serves content from (public domains, subdomains, CDNs, load balancer VIPs and server addresses).
    Anchor each value to avoid matches inside attacker-controlled hostnames, e.g. '://example.com/', '://example.com:', '.example.com/' and '.example.com:'.
references:
    - https://docs.canarytokens.org/guide/css-cloned-site-token.html
    - https://docs.canarytokens.org/guide/cloned-web-token.html
author: Abdullah Alzamil
date: 2026-10-16
tags:
    - attack.resource-development
    - attack.t1608.005
    - attack.t1583.001
    - attack.reconnaissance
    - attack.t1598.003
logsource:
    category: webserver
detection:
    selection_asset:
        cs-uri-stem|endswith:
            - '.css'
            - '.ico'
            - '.js'
            - '.png'
            - '.svg'
    selection_referer:
        cs-referer|exists: true
    filter_main_empty_referer:
        cs-referer:
            - ''
            - '-'
    filter_main_owned:
        cs-referer|contains|expand: '%owned_web_origins%'
    condition: all of selection_* and not 1 of filter_main_*
falsepositives:
    - Owned domains, subdomains, CDNs or addresses missing from the placeholder values
    - Legitimate third-party sites embedding the organization's assets
    - Local development or staging environments
level: medium
