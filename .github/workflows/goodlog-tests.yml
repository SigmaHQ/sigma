name: Goodlog Tests

on: [push, pull_request, merge_group, workflow_dispatch]

env:
  EVTX_BASELINE_VERSION: v0.8.5

jobs:
  check-baseline:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows 7 32-bit
            tgz: win7-x86.tgz
            dir: win7-x86
            cache_key: baseline-win7-x86
          - name: Windows 10
            tgz: win10-client.tgz
            dir: Logs_Client
            cache_key: baseline-win10-client
          - name: Windows 11
            tgz: win11-client.tgz
            dir: Logs_Win11
            cache_key: baseline-win11-client
          - name: Windows 11 2023
            tgz: win11-client-2023.tgz
            dir: Logs_Win11_2023
            cache_key: baseline-win11-client-2023
          - name: Windows 2022
            tgz: win2022-evtx.tgz
            dir: win2022-evtx
            cache_key: baseline-win2022-evtx
          - name: Windows 2022 Domain Controller
            tgz: win2022-ad.tgz
            dir: Win2022-AD
            cache_key: baseline-win2022-ad
          - name: Windows 2022 Azure
            tgz: win2022-0-20348-azure.tgz
            dir: win2022-0-20348-azure
            cache_key: baseline-win2022-0-20348-azure

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: pip install pyyaml

    - name: Cache evtx-sigma-checker
      id: cache-evtx-checker
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: evtx-sigma-checker
        key: evtx-sigma-checker-${{ env.EVTX_BASELINE_VERSION }}

    - name: Download evtx-sigma-checker
      if: steps.cache-evtx-checker.outputs.cache-hit != 'true'
      run: wget --no-verbose https://github.com/NextronSystems/evtx-baseline/releases/download/$EVTX_BASELINE_VERSION/evtx-sigma-checker

    - name: Set evtx-sigma-checker permissions
      run: chmod +x evtx-sigma-checker

    - name: Cache ${{ matrix.name }} baseline
      id: cache-baseline
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ${{ matrix.dir }}/
        key: ${{ matrix.cache_key }}-${{ env.EVTX_BASELINE_VERSION }}

    - name: Download and extract ${{ matrix.name }} baseline
      if: steps.cache-baseline.outputs.cache-hit != 'true'
      run: |
        wget --no-verbose https://github.com/NextronSystems/evtx-baseline/releases/download/$EVTX_BASELINE_VERSION/${{ matrix.tgz }}
        tar xzf ${{ matrix.tgz }}

    - name: Cache ${{ matrix.name }} findings
      id: cache-findings
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: findings.json
        key: goodlog-findings-${{ matrix.cache_key }}-${{ env.EVTX_BASELINE_VERSION }}-${{ hashFiles('rules/windows/**/*.yml', 'rules-emerging-threats/**/*.yml', 'rules-threat-hunting/**/*.yml', 'tests/thor.yml') }}

    - name: Run goodlog checks for ${{ matrix.name }}
      run: |
        python tests/windows_goodlog_baseline_runner.py \
          --evtx-checker ./evtx-sigma-checker \
          --log-source tests/thor.yml \
          --evtx-path ${{ matrix.dir }}/ \
          --rule-paths rules/windows/ rules-emerging-threats/ rules-threat-hunting/ \
          --known-fps .github/workflows/known-FPs.csv \
          --findings findings.json
