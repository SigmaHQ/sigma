name: Regression Tests

on: [push, pull_request, workflow_dispatch]

env:
  EVTX_BASELINE_VERSION: v0.8.4
  JSON_MATCHER_VERSION: v0.0.2
  TOTAL_SHARDS: 4

jobs:
  true-positive-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: ["1/4", "2/4", "3/4", "4/4"]
    name: "Regression Tests (shard ${{ matrix.shard }})"
    steps:
    - uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: tests/requirements.txt

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r tests/requirements.txt

    - name: Cache evtx-sigma-checker
      id: cache-evtx-checker
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
      with:
        path: evtx-sigma-checker
        key: evtx-sigma-checker-${{ env.EVTX_BASELINE_VERSION }}

    - name: Download evtx-sigma-checker
      if: steps.cache-evtx-checker.outputs.cache-hit != 'true'
      run: |
        wget --no-verbose https://github.com/NextronSystems/evtx-baseline/releases/download/$EVTX_BASELINE_VERSION/evtx-sigma-checker
        chmod +x evtx-sigma-checker

    - name: Restore evtx-sigma-checker permissions
      if: steps.cache-evtx-checker.outputs.cache-hit == 'true'
      run: chmod +x evtx-sigma-checker

    - name: Cache json-checker
      id: cache-json-checker
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
      with:
        path: json_checker
        key: json-checker-${{ env.JSON_MATCHER_VERSION }}

    - name: Download json-checker
      if: steps.cache-json-checker.outputs.cache-hit != 'true'
      run: |
        wget --no-verbose https://github.com/SigmaHQ/json_matcher/releases/download/$JSON_MATCHER_VERSION/json_matcher_$JSON_MATCHER_VERSION -O json_checker
        chmod +x json_checker

    - name: Restore json-checker permissions
      if: steps.cache-json-checker.outputs.cache-hit == 'true'
      run: chmod +x json_checker

    - name: Run regression tests
      run: |
        python tests/regression_tests_runner.py --rules-paths rules rules-emerging-threats rules-threat-hunting --evtx-checker ./evtx-sigma-checker --thor-config tests/thor.yml --ignore-validation --json-checker ./json_checker --workers 8 --shard ${{ matrix.shard }}

  all-shards-passed:
    needs: [true-positive-tests]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all shards passed
        run: |
          if [[ "${{ needs.true-positive-tests.result }}" != "success" ]]; then
            echo "One or more shards failed"
            exit 1
          fi
          echo "All shards passed"
