name: webserver_fieldmapping
priority: 100
transformations:
    # W3C field names contain hyphens, which golang_expr reads as subtraction: index the event map instead
    - id: field_mapping_webserver
      type: field_name_mapping
      mapping:
          c-ip: $env["c-ip"]
          c-win32-status: $env["c-win32-status"]
          cs-bytes: $env["cs-bytes"]
          cs-cookie: $env["cs-cookie"]
          cs-host: $env["cs-host"]
          cs-method: $env["cs-method"]
          cs-referer: $env["cs-referer"]
          cs-uri-query: $env["cs-uri-query"]
          cs-uri-stem: $env["cs-uri-stem"]
          cs-user-agent: $env["cs-user-agent"]
          cs-username: $env["cs-username"]
          cs-version: $env["cs-version"]
          s-computername: $env["s-computername"]
          s-ip: $env["s-ip"]
          s-port: $env["s-port"]
          s-sitename: $env["s-sitename"]
          sc-bytes: $env["sc-bytes"]
          sc-status: $env["sc-status"]
          time-taken: $env["time-taken"]
      rule_conditions:
          - type: logsource
            category: webserver
